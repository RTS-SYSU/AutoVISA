.proof-stage-body{min-width:0;padding:clamp(14px,2vw,24px)}.proof-stage-body header{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap}.proof-stage-body header h3{margin:0;font-size:1.3rem}.stage-result{color:var(--rt-blue)}
.stage-issues>summary,.proof-more>summary{cursor:pointer;width:fit-content}.stage-issues>summary{color:var(--rt-blue);font-weight:650}.stage-issues li{margin-bottom:.6rem;overflow-wrap:anywhere}
.proof-more{margin-top:1.1rem;border-top:1px solid var(--rt-line);padding-top:.65rem}.proof-more .action-row,.stage-issues .action-row{margin-top:.65rem}
@media(max-width:760px){.proof-browser{grid-template-columns:1fr}.proof-stage-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-inline-end:0;border-bottom:1px solid var(--rt-line)}#rt-workspace .proof-stage-list .control{padding:7px;white-space:normal}}
.proof-dag-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(12rem,2fr);gap:1.5rem}
.proof-graph-scroll{overflow:auto;max-height:31rem;background:var(--rt-bg);border-radius:8px}
.proof-graph{position:relative;margin-inline:auto}.proof-graph svg{position:absolute;inset:0}
.proof-graph g path{fill:none;stroke:var(--rt-muted);opacity:.35;stroke-width:1.2}.proof-graph g path.focus{stroke:var(--rt-blue);opacity:1;stroke-width:2}
.proof-graph marker path{fill:var(--rt-muted)}
#rt-workspace .dag-dot{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--rt-muted);border-radius:20px;background:var(--rt-panel);color:var(--rt-ink);padding:4px 9px;cursor:pointer}
#rt-workspace .dag-dot[aria-pressed=true]{outline:3px solid var(--rt-blue)}#rt-workspace .dag-dot.verified{border-color:#18816a}#rt-workspace .dag-dot.open{border-color:#ac6025}
@media(max-width:760px){.proof-dag-layout{grid-template-columns:1fr}}
</style></head>
<body>
<div id="rt-workspace" aria-label="AutoVISA research workspace">
  <div class="shell">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark"><i data-lucide="shield-check" aria-hidden="true"></i></span>AutoVISA</div>
      <nav id="av-navigation" class="navgroup" aria-label="Workspace navigation"></nav>
      <nav id="av-utilities" class="railfoot" aria-label="Utilities"></nav>
    </aside>
    <main class="main">
      <div class="topbar"><div class="breadcrumb"><button type="button" class="control quiet icon-only sidebar-toggle" data-action="sidebar" aria-label="Collapse navigation" aria-expanded="true"><span class="rail-chevron" aria-hidden="true">‹</span></button><span id="av-breadcrumb" class="breadcrumb"></span></div><details class="mobile-nav"><summary>Navigation</summary><nav id="av-mobile-links" aria-label="Mobile navigation"></nav></details></div>
      <section id="av-module-page" aria-label="Current module"></section>
      <section id="av-derivation-page" hidden>
      <div class="pagehead"><div class="headinggroup"><h1>Derivation</h1></div><div class="toolbar route-control"><label class="small muted">Explore route <select id="rt-route" aria-label="Proof route"><option value="independent">Independent</option><option value="prosa">Prosa reuse</option></select></label><button type="button" class="control primary" data-action="gap"><i data-lucide="git-merge" aria-hidden="true"></i>Review gap</button></div></div>
      <div class="viewbar"><div class="viewtabs" aria-label="Workspace views"><button type="button" class="viewtab" data-view="workflow" aria-pressed="true">Workflow</button><button type="button" class="viewtab" data-view="artifacts" aria-pressed="false">Artifacts</button></div><div class="route-meta"><span>Run 03</span><span>·</span><span id="rt-version">Independent v2</span><span>·</span><span>Context v2</span></div></div>
      <section id="rt-workflow-view">
        <section class="canvasarea" aria-label="Derivation workflow"><div id="rt-flow" class="graph" aria-label="Seven selectable derivation stages"><svg class="wires" aria-hidden="true"></svg></div></section>
        <section class="artifact-panel" id="rt-artifact-panel" aria-label="Selected stage and its artifacts">
          <div class="stagehead"><div class="stageheading"><h2 id="rt-stage-title">Forward reasoning</h2><span class="count" id="rt-output-count">3 outputs</span></div><div class="toolbar"><label class="stagepicker small muted">Stage<select id="rt-stage-select" aria-label="Select stage in focus mode"></select></label><button type="button" class="control quiet" data-action="focus" aria-expanded="false"><i data-lucide="maximize-2" aria-hidden="true"></i><span id="rt-focus-label">Focus</span></button></div></div>
          <div class="artifact-layout"><nav class="artifact-list" aria-label="Stage outputs"><div class="artifact-list-label">Outputs</div><div id="rt-output-list" style="display:contents"></div></nav><div class="artifact-body"><div class="artifact-titlebar"><div class="artifact-title"><h3 id="rt-artifact-title">Claim graph</h3><span class="status" id="rt-artifact-status">Draft</span></div><div class="detailtabs" aria-label="Artifact views"><button type="button" class="detailtab" data-detail="preview" aria-pressed="true">Preview</button><button type="button" class="detailtab" data-detail="details" aria-pressed="false">Details</button><button type="button" class="detailtab" data-detail="sources" aria-pressed="false">Sources</button></div></div><div id="rt-artifact-content" class="artifact-content" aria-live="polite"></div><div class="artifact-foot"><span id="rt-artifact-id"></span><div id="av-next-output"></div></div></div></div>
        </section>
      </section>
      <section id="rt-catalog-view" class="catalog" hidden><div class="catalog-head"><h2>All artifacts</h2><label class="small muted">Find an artifact <input id="rt-search" type="search" placeholder="Name or stage" autocomplete="off"></label></div><div class="catalog-row catalog-labels" aria-hidden="true"><span>Artifact</span><span>Stage</span><span class="kind">Type</span></div><div id="rt-catalog-rows"></div><div id="rt-no-results" class="blank" hidden><strong>No matching artifacts</strong><p>Try a stage name such as Forward.</p><button type="button" class="control" data-action="clear-search" style="margin-top:12px">Clear search</button></div></section>
      </section>
    </main>
  </div>
</div>
<script>
(() => {
  /** @type {HTMLElement} Root element for this interactive design, isolated from the product app. */
  const root = document.getElementById('rt-workspace');
  /** @type {Object<string, Object>} Stage definitions and artifact ownership for the example route. */
  const stages = {
    context:{name:'Context',title:'Context',status:'Snapshot',cell:[1,2],inputs:['Selected model','Selected goal'],outputs:[['CTX-01','Model snapshot','Diagram','context'],['CTX-02','Scope & assumptions','Table','scope'],['CTX-03','Target statement','Statement','target'],['CTX-04','Source map','Table','sourcemap']]},
    forward:{name:'Forward',title:'Forward reasoning',status:'Draft',cell:[2,1],inputs:['Context v2','General lemmas'],outputs:[['FWD-01','Claim graph','Diagram','claims'],['FWD-02','Bound candidates','Table','bounds'],['FWD-03','Dependencies','Diagram','dependencies']]},
    backward:{name:'Backward',title:'Backward reasoning',status:'Draft',cell:[2,3],inputs:['Target statement','Context v2'],outputs:[['BWD-01','Goal tree','Diagram','goals'],['BWD-02','Open obligations','Table','obligations'],['BWD-03','Required premises','Table','premises']]},
    alignment:{name:'Alignment',title:'Alignment',status:'Needs review',cell:[3,2],inputs:['Forward claims','Backward obligations'],outputs:[['ALN-01','Correspondence map','Diagram','alignment'],['ALN-02','Gap list','Table','gaps'],['ALN-03','Scope checks','Table','conflicts']]},
    bridges:{name:'Bridges',title:'Bridge construction',status:'Open',cell:[4,2],inputs:['Alignment gap','Scheduling semantics'],outputs:[['BRG-01','Bridge candidate','Diagram','bridge'],['BRG-02','Review note','Statement','review'],['BRG-03','Impact map','Diagram','impact']]},
    proof:{name:'Proof',title:'Proof assembly',status:'Draft',cell:[5,1],inputs:['Claims and bridge lemmas','Allowed library resources'],outputs:[['PRF-01','Proof plan','Diagram','proof'],['PRF-02','Rocq source','Code','code'],['PRF-03','Library references','Table','libraries']]},
    check:{name:'Check',title:'Proof checking',status:'Not run',cell:[5,3],inputs:['Proof files','Versioned environment'],outputs:[['CHK-01','Goal status','Report','check'],['CHK-02','Checker log','Report','log'],['CHK-03','Assumption audit','Report','audit'],['CHK-04','Environment','Table','environment']]}
  };
  /** @type {Array<Array<string>>} Directed artifact dependencies, not mathematical implications. */
  const flowEdges = [['context','forward'],['context','backward'],['forward','alignment'],['backward','alignment'],['alignment','bridges'],['bridges','proof'],['proof','check']];
  /** @type {Object} Presentation state: page and per-module views, route selection, local input drafts and display preferences. */
  const state = {page:'projects',stage:'forward',artifact:0,detail:'preview',view:'workflow',route:'independent',focus:false,navHidden:false,query:'',claim:'workload',documentTab:'pdf',modelTab:'model',verificationTab:'status',resourceTab:'skills',runTab:'summary',settingsTab:'general',latex:'A_j(r_j,d_j) \\ge C_j',inputDraft:{model:'',assumptions:'',analysis:'',goal:''},appearance:'system'};
  /** @type {ResizeObserver|null} Observer keeping vector connectors attached to actual node positions. */
  let diagramObserver = null;
  /** @type {Object<string,Array<string>>} Page titles and navigation icons. */
  const pages = {
    projects:['Projects','folder-open'],
    overview:['Overview','layout-dashboard'],
    documents:['Documents','files'],
    modeling:['Modeling','sliders-horizontal'],
    derivation:['Derivation','workflow'],
    verification:['Proof','shield-check'],
    'expert-audit':['Expert audit','shield-check'],
    runs:['Runs','history'],
    resources:['Resources','library'],
    settings:['Settings','settings'],
    help:['Help','circle-help']
  };
  /** @type {Array<string>} Modules scoped to the selected project, nested under Projects. */
  const projectPages=['overview','documents','modeling','derivation','verification','expert-audit','runs'];
  /** @type {string} Local notification text; never interpreted as backend confirmation. */
  let feedback='';
  /** @type {Object<string,string>} Reviewable fields shared by manual input, snapshots and comparisons. */
  const inputFields={model:'System model',assumptions:'Assumptions',analysis:'Analysis method',goal:'Proof target'};
  /** @type {Object<string,string>} Optional paper locators attached to individual input fields. */
  const referenceFields={modelRef:'Model reference',assumptionsRef:'Assumptions reference',analysisRef:'Analysis reference',goalRef:'Goal reference'};
  /** @type {Object} Fixed parent record; switching the diagram view never edits this record. */
  const exampleRun={id:3,parent:null,route:'independent',source:'case_11 scope',note:'',model:'Integer time. Independent sporadic tasks on one preemptive DM processor, with a fixed tie order and an empty initial system. Each job executes at most C, with 0 < C ≤ D ≤ T. No blocking, self-suspension or scheduling overhead.',analysis:'Accept when every task passes the iterative deadline test.',goal:'For every legal release trace, every job finishes by its deadline if the test accepts.'};
  Object.assign(state,{paperReview:null,records:[],draftRefs:{},activeId:3,draftParent:3,draftRoute:'prosa',reviewing:false,draftStarted:false,draftNote:'',draftSource:'Manual input'});
  /** @type {Object} Defaults used to isolate drafts, selections and history on project switches. */
  const defaults=structuredClone(state);
  /** @type {Array<Object>} Each project owns its metadata and last workspace snapshot. */
  let projects=[{id:'example',name:'case_11',description:'Deadline guarantee under DM scheduling',workspace:null}];
  /** @type {Object} Active project, also used when opening project-level navigation. */
  let project=projects[0];
  /** @type {boolean} Creation is a separate view of the project directory. */
  let creating=false;
  /** @type {Object} Initial values for a project with no run yet. */
  const blank={id:0,parent:null,route:'prosa',source:'Manual input',note:'',model:'',assumptions:'',analysis:'',goal:''};
  /** @returns {boolean} Whether the project contains the illustrated case study. */
  function isExample(){return project.id==='example';}
  /** @param {Object} next Destination project. @returns {void} */
  function openProject(next){
    if(project!==next){
      reading++;readStatus='';
      project.workspace=structuredClone(state);project=next;
      const appearance=state.appearance;
      Object.assign(state,structuredClone(defaults),{activeId:isExample()?3:0,draftParent:isExample()?3:0,documentTab:'manual'});
      restore(next.workspace&&{...next.workspace,designVersion:4});
      state.appearance=appearance;
    }
    navigate('overview');
  }
  /** @returns {string} Project list or the project metadata form. */
  function projectDirectory(){
    if(creating)return `<form id="project-form" class="stack surface project-form"><label class="field">Project name<input name="projectName" required maxlength="100" autocomplete="off" placeholder="e.g. Sporadic task analysis"></label><label class="field">Description (optional)<textarea name="description" maxlength="500"></textarea></label><div class="action-row"><button type="submit" class="control primary">Continue to import</button>${pageLink('projects','Cancel')}</div></form>`;
    const entries=projects.map(item=>{
      const run=(item===project?state:item.workspace)?.records?.at(-1)||(item.id==='example'?exampleRun:null);
      const certified=[...(item.documents||[])].reverse().find(doc=>doc.paperVerification);
      if(!run&&certified){
        const receipt=certified.paperVerification;
        return `<article class="project-entry"><button class="project-open" type="button" data-project="${esc(item.id)}"><span class="project-symbol">${icon('file-text')}</span><span><strong>${esc(item.name)}</strong><br><span class="report-meta">${esc(receipt.claim.statement)}</span></span></button>
          <div class="action-row"><button class="control" type="button" data-project-report="${esc(item.id)}" data-paper-report="${esc(certified.id)}">${receipt.status==='verified'?'View verified claim':'View certificate check'}</button><details class="project-menu"><summary class="control" aria-label="More actions for ${esc(item.name)}">•••</summary><button class="control delete-project" type="button" data-delete-project="${esc(item.id)}">Delete</button></details></div></article>`;
      }
      const key=item.irKeys?.[run?.id];
      const outcome=key?proofOutcome(audit.current({key,version:argumentVersions.get(key)||2,project:item.id,run:run.id})):null;
      const exampleRunSelected=item.id==='example'&&run?.id===exampleRun.id;
      const status=exampleRunSelected?'Main theorem unproved':outcome?.status||(run?'Report available':'Awaiting claim');
      return `<article class="project-entry"><button class="project-open" type="button" data-project="${esc(item.id)}"><span class="project-symbol">${icon(item.id==='example'?'book-open':'folder')}</span><span><strong>${esc(item.name)}</strong><br><span class="report-meta">${esc(run?.goal?.split('\n').find(line=>line.trim())||item.description||'No confirmed claim')}</span><br><span class="report-meta">${status}</span></span></button><div class="action-row">${run?`<button type="button" class="control" data-project-report="${esc(item.id)}" data-report-run="${run.id}">View report</button>`:''}<details class="project-menu"><summary class="control" aria-label="More actions for ${esc(item.name)}">•••</summary><button class="control delete-project" type="button" data-delete-project="${esc(item.id)}">Delete</button></details></div></article>`;
    }).join('');
    const example=projects.find(item=>item.id==='example');
    return `<div class="project-home">
      <section class="paper-entry" aria-labelledby="paper-entry-title">
        <div><h2 id="paper-entry-title">Verify a claim from a paper</h2>
        <p>Import a real-time systems paper, locate its timing guarantee and check the formal claim in Rocq.</p>
        <div class="import-actions"><div class="action-row"><label class="control primary file-trigger">${icon('upload')} Choose paper PDF<input id="av-paper-upload" type="file" accept=".pdf,application/pdf" aria-label="Choose paper PDF" ${quickImporting?'disabled':''}></label><button class="control quiet" type="button" data-module-action="new-project">Create project manually</button></div>
        <p>Use a PDF with selectable text.</p><p role="status">${esc(quickImportStatus)}</p></div></div>
        ${example?`<article class="surface report-card example-report"><header><strong>${icon('file-text')} Example report</strong><span class="report-meta">case_11</span></header><div class="example-report-body"><h3>Deadline guarantee under DM scheduling</h3><p class="paper-claim">${esc(exampleRun.goal)}</p><div class="example-obligation"><strong>Open obligation</strong><p>Derive job completion from the available-service bound.</p></div></div><footer><span class="report-status">Main theorem unproved</span><button class="control" type="button" data-project-report="example" data-report-run="${exampleRun.id}" data-report-tab="obligations">View open obligations ${icon('arrow-right')}</button></footer></article>`:''}
      </section>
      <section aria-labelledby="project-list-title"><h2 id="project-list-title">Recent verification</h2><div class="project-list">${entries||'<p>No projects yet.</p>'}</div></section>
    </div>`;
  }
  /** @param {string} id Immutable project ID. Deleted IDs keep stale tabs from restoring content. */
  function wasDeleted(id){return localStorage.getItem('autovisa.removed.'+id)==='1';}

  /** @param {Object} target Exact project selected in the directory. */
  function confirmProjectDeletion(target){
    if(!target)return;
    const dialog=document.createElement('dialog');
    dialog.className='delete-confirm';
    dialog.setAttribute('aria-labelledby','delete-project-title');
    dialog.innerHTML='<h2 id="delete-project-title"></h2><p>This permanently deletes the project’s imported copies, drafts, runs, proof evidence, audit results and logs.</p><p role="status" aria-live="polite"></p><footer><button type="button" data-cancel autofocus>Cancel</button><button type="button" data-confirm>Delete project</button></footer>';
    dialog.querySelector('h2').textContent='Delete '+target.name+'?';
    const cancel=dialog.querySelector('[data-cancel]'),confirm=dialog.querySelector('[data-confirm]');
    cancel.onclick=()=>dialog.close();
    dialog.oncancel=event=>{if(confirm.disabled)event.preventDefault();};
    dialog.onclose=()=>dialog.remove();
    confirm.onclick=async()=>{
      confirm.disabled=cancel.disabled=true;
      const status=dialog.querySelector('[role=status]');
      status.textContent='Deleting project…';
      try{
        const result=await modelRequest('delete-project',{project:target.id});
        if(result.deleted!==true)throw Error('Project deletion was not confirmed by the local service.');
        const saved=JSON.parse(localStorage.getItem(storageKey));
        const directory=saved?.projects||projects;
        const copies=new Set([...(target.documents||[]),...(directory.find(p=>p.id===target.id)?.documents||[])].map(doc=>doc.id));
        for(const other of directory)if(other.id!==target.id)for(const doc of other.documents||[])copies.delete(doc.id);
        await clearProjectPdfs(target.id,copies);
        localStorage.setItem('autovisa.removed.'+target.id,'1');
        const latest=JSON.parse(localStorage.getItem(storageKey));
        const remaining=(latest?.projects||projects).filter(item=>!wasDeleted(item.id));
        const current=remaining.find(item=>item.id===(latest?.current||project.id))||remaining[0];
        localStorage.setItem(storageKey,JSON.stringify({projects:remaining,current:current?.id||null}));
        location.replace(location.pathname+'?view=projects');
      }catch(error){
        status.textContent=error.message+' You can retry deletion.';
        confirm.disabled=cancel.disabled=false;
      }
    };
    document.body.append(dialog);dialog.showModal();
  }
  // Drop transient proof caches and stop polling when another tab removes a project.
  window.addEventListener('storage',event=>{
    if(event.key?.startsWith('autovisa.removed.')&&projects.some(item=>'autovisa.removed.'+item.id===event.key)){
      location.replace(location.pathname+'?view=projects');
    }
  });

  /** Return an immutable input snapshot by resolving the changes against its parent.
   * @param {number} id Run identifier.
   * @returns {Object} Frozen input, source and route for this record.
   */
  function recordFor(id){
    if(isExample()&&id===3)return exampleRun;
    if(!id)return blank;
    /** @type {Object} Stored changes for this run. */
    const entry=state.records.find(item=>item.id===id);
    return entry?{...recordFor(entry.parent),...entry}:blank;
  }
  /** @param {number} id Run number. @returns {string} Display name. */
  function runName(id){return 'Run '+String(id).padStart(2,'0');}
  /** @param {string} route Saved proof strategy. @returns {string} Visible route name. */
  function routeName(route){return route==='prosa'?'Prosa reuse':'Independent';}
  /** @param {string} action Action key. @param {string} label Visible action. @param {boolean} primary Main action. @returns {string} Native button. */
  function actionButton(action,label,primary=false){return `<button type="button" class="control ${primary?'primary':''}" data-module-action="${action}">${label}</button>`;}
  /** @param {number} id Record to select. @param {string} label Button label. @param {string} page Destination module. @returns {string} Run-bound navigation. */
  function recordLink(id,label,page='runs'){return `<button type="button" class="control" data-record="${id}" data-page="${page}">${esc(label)}</button>`;}
  /** Start a working copy and preserve an existing unfinished draft. @returns {void} */
  function prepareDraft(){
    if(state.draftStarted)return;
    /** @type {Object} Historical parent of the new working copy. */
    const parent=recordFor(state.activeId);
    state.draftParent=parent.id;state.draftRoute=parent.route;state.draftSource=parent.source;state.draftNote='';
    state.paperReview=parent.paperReview?structuredClone(parent.paperReview):null;
    state.inputDraft=Object.fromEntries(Object.keys(inputFields).map(key=>[key,parent[key]||'']));
    state.draftRefs=Object.fromEntries(Object.keys(referenceFields).map(key=>[key,parent[key]||'']));
    state.draftStarted=true;
  }
  /** @param {Object} parent Frozen parent. @param {Object} child Compared snapshot. @returns {Array<Array<string>>} Current parent-to-draft field changes without inferred analysis. */
  function changesBetween(parent,child){return Object.entries({...inputFields,...referenceFields,route:'Route',source:'Source',note:'Revision note'}).filter(([key])=>(parent[key]||'')!==(child[key]||'')).map(([key,label])=>[label,key==='route'?routeName(parent[key]):citation(parent[key])?.label||parent[key]||'—',key==='route'?routeName(child[key]):citation(child[key])?.label||child[key]||'—']);}
  /** @returns {Object} Input snapshot currently under review. */
  function workingCopy(){
    /** @type {Object<string,string>} Explicit empty locators remove inherited references after changing a paper. */
    const references=Object.fromEntries(Object.keys(referenceFields).map(key=>[key,state.draftRefs[key]||'']));
    return {...state.inputDraft,...references,source:state.draftSource,route:state.draftRoute,note:state.draftNote.trim()};
  }
  /** Render LaTeX markup with an escaped, readable source fallback.
   * @param {string} tex LaTeX expression without delimiters.
   * @param {boolean} display Whether to use a separate display equation.
   * @returns {string} A rendering target retaining its original expression.
   */
  function math(tex,display=false){
    return `<span class="${display?'latex-block':'latex-inline'}" style="${display?'display:block':''}" data-tex="${esc(tex)}" data-display="${display}">${esc(tex)}</span>`;
  }
  /** Typeset known notation inside otherwise escaped table and graph labels.
   * @param {string} value Human-readable example text.
   * @returns {string} Escaped text with explicitly mapped formula spans.
   */
  function mathText(value){
    /** @type {Object<string,string>} Existing notation mapped without changing its meaning. */
    const notation={'0 < C ≤ D ≤ T':String.raw`0<C_i\le D_i\le T_i`,'e ≤ C':String.raw`e_j\le C_j`,'[rⱼ, dⱼ)':String.raw`[r_j,d_j)`,'eⱼ':String.raw`e_j`,'dⱼ':String.raw`d_j`,'rⱼ':String.raw`r_j`};
    /** @type {string} Escaped content, with only recognized expressions replaced. */
    let result=esc(value);
    Object.entries(notation).forEach(([label,tex])=>{result=result.replaceAll(esc(label),math(tex));});
    return result;
  }
  /** Typeset newly rendered expressions; a malformed formula cannot disable navigation.
   * @returns {void}
   */
  function renderMath(scope=root){
    if(!window.katex)return;
    (scope?.querySelectorAll?scope:root).querySelectorAll('[data-tex]:not([data-typeset])').forEach(element=>{
      try{
        window.katex.render(element.dataset.tex,element,{displayMode:element.dataset.display==='true',output:'mathml',throwOnError:true,trust:false,strict:'ignore'});
        element.dataset.typeset='true';
      }catch(error){
        element.textContent=element.dataset.tex;
        element.dataset.typeset='invalid';
        element.insertAdjacentHTML('beforeend','<span class="section-note"> — Check LaTeX syntax</span>');
      }
    });
    argumentReader.bindSymbols(scope?.querySelectorAll?scope:root);
  }
  /** Build a navigation control with the current page exposed to assistive technology.
   * @param {string} id Page identifier.
   * @returns {string} Native navigation button.
   */
  function navButton(id){
    return `<button type="button" class="navrow ${state.page===id?'active':''} ${id==='projects'&&projectPages.includes(state.page)?'parent-active':''}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(pages[id][1])}${pages[id][0]}</button>`;
  }
  /** Build compact page-local switches, preserving each module's selection.
   * @param {string} field State property owned by the page.

  /** Build a primary or secondary action that opens a specific derivation output.
   * @param {string} stage Destination workflow stage.

  /** Build a page navigation action.

  /** @type {number} Generation of the most recent local import. */
  let reading=0;
  /** @type {string} Reader progress or actionable error. */
  let readStatus='';
  /** @type {string} Visible side of the review editor on small screens. */
  let inputPane='source';
  /** @returns {Object|undefined} Active source inside this project. */
  function selectedDocument(){return project.documents?.find(doc=>doc.id===project.selectedDocument);}
  /** @param {string} ref Immutable document and selection offsets. @returns {Object|null} Citation details. */
  function citation(ref){
    const [id,a,b]=String(ref||'').split(':');
    const doc=project.documents?.find(item=>item.id===id);
    if(!doc||!b)return null;
    const start=Number(a),end=Number(b);
    let pos=0,first=1,last=1;
    doc.units.forEach((text,i)=>{if(pos<=start)first=i+1;if(pos<end)last=i+1;pos+=text.length+1;});
    return {doc,start,end,label:doc.name+' · '+doc.unit+' '+first+(last!==first?'–'+last:'')};
  }
  /** @param {string} ref Citation or legacy typed location. @param {boolean} flat Whether the caller already groups the source links. @returns {string} Clickable source label. */
  function citeLink(ref,flat=false){
    if(typeof ref==='string'&&ref.startsWith('msa:'))return (flat?'':'<details class="msa-sources"><summary>Sources ('+ref.slice(4).split('|').length+')</summary>')+ref.slice(4).split('|').map(pair=>{const [index,location]=pair.split('=');const item=citation(location);return item?`<button type="button" class="cite" data-cite="${esc(location)}" title="${esc(item.label)}">[${esc(index)}] ${esc(item.label.slice(item.doc.name.length+3))}</button>`:'';}).join(' ')+(flat?'':'</details>');
    const hit=citation(ref);
    return hit?`<button type="button" class="cite" data-cite="${esc(ref)}">${esc(hit.label)}</button>`:esc(ref||'');
  }
  /** @param {string} ref Saved citation to open without changing the workspace. */
  function showSource(ref){
    const hit=citation(ref);if(!hit)return;
    const text=hit.doc.units.join('\n'),dialog=document.createElement('dialog');
    dialog.id='source-dialog';
    dialog.innerHTML=`<h2>${esc(hit.label)}</h2><pre>${esc(text.slice(0,hit.start))}<mark>${esc(text.slice(hit.start,hit.end))}</mark>${esc(text.slice(hit.end))}</pre><button type="button">Close</button>`;
    document.body.append(dialog);dialog.querySelector('button').onclick=()=>dialog.close();
    dialog.onclose=()=>dialog.remove();dialog.showModal();dialog.querySelector('mark').scrollIntoView({block:'center'});
  }
  /** @returns {string} Input chooser, document preview and editable fields. */
  /** Render headings, paragraphs, lists, emphasis and delimited LaTeX without interpreting raw HTML.
   * @param {string} source User-authored Markdown with optional inline and display math.
   * @returns {string} Escaped reading view; the underlying source remains editable verbatim.
   */
  function markdownView(source,ref=''){
    /** Numbered exact passages belonging to this field, independent of other MSA fields. */
    const anchors=new Map(String(ref).startsWith('msa:')?ref.slice(4).split('|').map(pair=>pair.split('=')):[]);
    const equations=[];
    const token='\u0000';
    const prose=String(source??'').replaceAll(token,'').replace(/\\\[([\s\S]*?)\\\]/g,(_,tex)=>'$$'+tex+'$$').replace(/\\\(([\s\S]*?)\\\)/g,(_,tex)=>'$'+tex+'$').replace(/\$\$([\s\S]+?)\$\$|\$([^\n$]+?)\$/g,(_,block,inline)=>{
      const index=equations.push(math(block??inline,block!==undefined))-1;
      return (block!==undefined?'\n\n':'')+token+index+token+(block!==undefined?'\n\n':'');
    });
    /** @param {string} line Plain Markdown prose with protected equation tokens. */
    function inlineText(line){
      return esc(line).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\[(\d+)\](?=(?:\s*\[\d+\])*\s*$)/g, (label,index)=>{
        const location=anchors.get(index),hit=location&&citation(location);
        return hit?`<button type="button" class="cite inline-cite" data-cite="${esc(location)}" title="${esc(hit.label)}" aria-label="Source ${index}, ${esc(hit.label)}">${label}</button>`:label;
      }).replace(/\u0000(\d+)\u0000/g,(_,index)=>equations[Number(index)]);
    }
    const output=[];let paragraph=[],items=[];
    function flush(){if(paragraph.length)output.push('<p>'+inlineText(paragraph.join(' '))+'</p>');if(items.length)output.push('<ul>'+items.join('')+'</ul>');paragraph=[];items=[];}
    for(const line of prose.split(/\r?\n/)){
      const heading=line.match(/^#{1,6}\s+(.+)/),item=line.match(/^\s*[-*+]\s+(.+)/);
      if(!line.trim()){flush();continue;}
      if(heading){flush();output.push('<h3>'+inlineText(heading[1])+'</h3>');continue;}
      if(item){if(paragraph.length)flush();items.push('<li>'+inlineText(item[1])+'</li>');continue;}
      if(items.length)flush();paragraph.push(line.trim());
    }
    flush();return '<div class="av-reading">'+output.join('')+'</div>';
  }

  /** Remember each document's current page while switching between reading and editing. */
  const sourcePages=new Map();
  const paperChecks=new WeakMap();

  async function importPaperProject(file){
    if(quickImporting)return;
    quickImporting=true;
    quickImportStatus='Reading '+file.name+'…';
    render();
    try{
      if(!/\.pdf$/i.test(file.name))throw Error('Choose a PDF file.');
      const doc=await readInputDocument(file);
      const base=file.name.replace(/\.pdf$/i,'').trim()||'Untitled paper';
      let name=base.slice(0,100);
      for(let i=2;projects.some(item=>item.name.toLowerCase()===name.toLowerCase());i++){
        const suffix=' ('+i+')';
        name=base.slice(0,100-suffix.length)+suffix;
      }
      const next={id:crypto.randomUUID(),name,description:'',workspace:null,documents:[doc],selectedDocument:doc.id};
      await originalPdf(doc.id,file,next.id);
      projects.unshift(next);
      openProject(next);
      navigate('documents');
      state.documentTab='pdf';
      readStatus='Paper imported. Extract the claim and assumptions to continue.';
      if(!remember())readStatus+=' Browser storage is full; the project is available in this tab.';
      quickImportStatus='';
      void checkPaperCertificate(next,doc,file);
    }catch(error){
      quickImportStatus=error.message||'Could not import the paper.';
    }finally{
      quickImporting=false;
      render();
    }
  }

  async function checkPaperCertificate(owner,doc,file){
    if(file.size>20*1024*1024)return;
    const ticket={};
    paperChecks.set(doc,ticket);
    if(owner===project)render();
    try{
      const response=await fetch('/api/paper-verification',{
        method:'POST', headers:{'Content-Type':'application/pdf'}, body:file,
      });
      if(!response.ok)return;
      const result=await response.json();
      if(paperChecks.get(doc)!==ticket||!projects.includes(owner))return;
      if(result.claim&&['verified','error'].includes(result.status)){
        doc.paperVerification=result;
        if(owner===project&&selectedDocument()===doc&&!state.activeId&&state.page==='documents'&&state.documentTab==='pdf'){
          navigate('verification');
          sourcePages.set(doc.id,result.claim.page);
        }
        remember();
      }
    }catch{
      // Paper import remains available if this server has no certificate route.
    }finally{
      if(paperChecks.get(doc)===ticket){
        paperChecks.delete(doc);
        if(owner===project)render();
      }
    }
  }

  function reportPreviewDocument(){
    if(state.page!=='verification')return selectedDocument();
    if(!state.activeId&&selectedDocument()?.paperVerification)return selectedDocument();

  function reportDocument(active){
    for(const field of ['goal','assumptions','model','analysis']){
      const ref=active[field+'Ref']||'';
      const locations=ref.startsWith('msa:')?ref.slice(4).split('|').map(pair=>pair.split('=')[1]):[ref];
      for(const location of locations){
        const hit=citation(location);
        if(hit)return hit.doc;
      }
    }
    return undefined;
  }

  function proofOutcome(result){
    const goal=result?.rounds?.at(-1)?.find(entry=>entry.id==='target_claim');
    const passed=Boolean(goal?.checked);
    const error=result?.stage==='error'||Boolean(result?.issue&&!goal);
    const status=passed?'Main theorem proved':error?'Verification error':result?.stage==='running'?'Verification in progress':!result||result.stage==='idle'||result.stage==='loading'?'Awaiting proof':'Main theorem unproved';
    return {goal,passed,error,status};
  }

  function verificationReport(active,example,details){
    const hit=citation(reportCitation);
    const doc=hit?.doc||reportDocument(active);
    const key=project.irKeys?.[active.id];
    const version=argumentVersions.get(key)||2;
    const result=key?audit.current({key,version,project:project.id,run:active.id}):null;

    const formalLines=goal?.source?.split('\n')||[];
    const statement=example?`forall (ts : TaskSet) (a : Arrivals) (s : Schedule),
  taskset_wf ts ->

  fig3_accepts ts ->
  all_deadlines_met ts a s.`:formalLines.filter(line=>/^Definition (model_assumptions|target_claim|proof_obligation) : Prop :=/.test(line)).join('\n');

    return `<div class="report-layout">
      <header class="surface report-card report-summary"><div><h2>${esc(project.name)}</h2><p class="report-meta">${esc(runName(active.id))} · ${esc(routeName(active.route))}</p></div><span class="report-status ${passed?'proved':error?'error':''}">${example?'Main theorem unproved':status}</span></header>

        ${doc?`<p class="report-meta">${esc(doc.name)}</p>${documentPreview(doc)}`:`<p class="report-meta">${example?'The example includes a formal target and recorded scope. A source PDF is unavailable.':'This run has no linked source passages.'}</p>`}

          <details ${example?'open':''}><summary>Model and assumptions</summary>${markdownView(active.model,active.modelRef)}${active.assumptions?markdownView(active.assumptions,active.assumptionsRef):''}</details>

  /** @param {Object} doc Local source document. @returns {string} Original-page reader or formatted text. */
  function documentPreview(doc){
    if(doc.unit!=='Page'){
      if(/\.(md|markdown)$/i.test(doc.name))return markdownView(doc.units.join('\n'));
      return '<div class="av-reading av-plain">'+doc.units.map(esc).join(doc.unit==='Paragraph'?'\n\n':'\n')+'</div>';
    }
    const current=documentPage(doc);
    return `<div class="pdf-preview"><div class="action-row"><button class="control" type="button" data-turn="-1" ${current===1?'disabled':''}>Previous</button><strong>Page ${current} of ${doc.units.length}</strong><button class="control" type="button" data-turn="1" ${current===doc.units.length?'disabled':''}>Next</button></div><div class="pdf-sheet"><span role="status">Loading original page…</span><canvas hidden aria-label="Original PDF page ${current}" role="img"></canvas></div></div>`;
  }
  /** @type {boolean} Prevent duplicate provider requests and keep pending work bound to its source. */
  const generating=new Set();
  /** @param {object} doc Selected document. @returns {string} Action-local extraction feedback. */
  function extractionNotice(doc){
    if(generating.has(doc))return '<p class="extract-notice" role="status">Extracting contributions and locating source passages…</p>';
    return doc?.extractionError?'<p class="extract-notice" role="alert"><strong>Extraction stopped.</strong> '+esc(doc.extractionError)+'</p>':'';
  }
  /** @param {string} route Local API action. @param {Object} [payload] Posted request body. */
  async function modelRequest(route,payload){
    const response=await fetch('/api/openai/'+route,{method:payload?'POST':'GET',headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined});
    const result=await response.json().catch(()=>({error:'Restart the local AutoVISA service to enable OpenAI settings.'}));
    if(!response.ok||result.error)throw Error(result.error||'Local service unavailable.');
    return result;
  }
  /** Open connection settings without losing the current project or document.
   * @returns {Promise<void>} Resolves after loading the current connection state.
   */
  async function connectionDialog(){
    if(document.querySelector('#openai-dialog'))return;
    const dialog=document.createElement('dialog');
    dialog.id='openai-dialog';dialog.setAttribute('aria-labelledby','connection-title');
    dialog.innerHTML='<h2 id="connection-title">OpenAI connection</h2><p role="status">Loading settings…</p><button type="button" data-close>Close</button>';
    document.body.append(dialog);dialog.onclose=()=>dialog.remove();dialog.showModal();
    dialog.onclick=event=>{if(event.target.closest('[data-close]'))dialog.close();};
    try{
      let config=await modelRequest('settings');
      if(!dialog.isConnected)return;
      dialog.innerHTML=`<h2 id="connection-title">OpenAI connection</h2><form><label>API key<input type="password" name="key" autocomplete="off" spellcheck="false" placeholder="Enter your key"></label><span data-key-status></span>${config.canRemember?'<label class="remember-key"><input type="checkbox" name="keep"> Remember new key on this Windows account</label>':''}<label>Model ID<input name="model" list="api-models" required value="${esc(config.model)}"></label><datalist id="api-models"></datalist><label data-catalog hidden>Available models<select data-available></select></label><label>Reasoning effort<select name="effort">${['default','none','minimal','low','medium','high','xhigh'].map(e=>'<option '+(e===config.effort?'selected':'')+'>'+e+'</option>').join('')}</select></label><details><summary>Organization and project</summary><label>Organization ID (optional)<input name="org" value="${esc(config.organization)}"></label><label>OpenAI project ID (optional)<input name="projectId" value="${esc(config.project)}"></label></details><div class="connection-actions"><button type="submit">Save connection</button><button type="button" data-check>Test model access</button><button type="button" data-models>List models</button></div><p role="status" aria-live="polite"></p><div class="connection-actions"><button type="button" data-close>Done</button><button type="button" data-forget>Forget saved key</button></div></form>`;
      const form=dialog.querySelector('form'),controls=form.elements,status=form.querySelector('[role=status]');
      function keyStatus(){
        form.querySelector('[data-key-status]').textContent=({session:'Key available for this service session.',windows:'Key saved with Windows encryption.',environment:'Using the OPENAI_API_KEY environment variable.'})[config.keySource]||'No key configured.';
        form.querySelector('[data-forget]').hidden=!['session','windows'].includes(config.keySource);
        controls.key.placeholder=config.keySource?'Enter a replacement key':'Enter your OpenAI API key';
      }
      keyStatus();
      /** @param {string} action Save form values, optionally check model access or retrieve IDs. */
      async function applyConnection(action){
        if(!form.reportValidity())return;
        const buttons=Array.from(form.querySelectorAll('button'));
        buttons.forEach(b=>b.disabled=true);status.textContent='Connecting…';
        try{
          config=await modelRequest('settings',{key:controls.key.value,remember:Boolean(controls.keep?.checked),model:controls.model.value.trim(),effort:controls.effort.value,organization:controls.org.value.trim(),project:controls.projectId.value.trim(),clear:action==='forget'});
          controls.key.value='';keyStatus();
          if(action==='test'){await modelRequest('test',{});status.textContent='Model access confirmed · '+config.model;}
          else if(action==='models'){
            const {models}=await modelRequest('models',{});
            form.querySelector('datalist').replaceChildren(...models.map(id=>new Option(id,id)));
            const select=form.querySelector('[data-available]');select.replaceChildren(new Option('Choose a model…',''),...models.map(id=>new Option(id,id)));
            select.onchange=()=>{if(select.value)controls.model.value=select.value;};form.querySelector('[data-catalog]').hidden=false;
            status.textContent=models.length+' models available. Select a model, then save the connection.';select.focus();
          }else status.textContent=action==='forget'?'Saved key removed.':'Connection saved.';
        }catch(error){status.textContent=error.message;}
        finally{buttons.forEach(b=>b.disabled=false);}
      }
      form.onsubmit=event=>{event.preventDefault();applyConnection('save');};
      form.querySelector('[data-check]').onclick=()=>applyConnection('test');
      form.querySelector('[data-models]').onclick=()=>applyConnection('models');
      form.querySelector('[data-forget]').onclick=()=>applyConnection('forget');
    }catch(error){dialog.querySelector('[role=status]').textContent=error.message;}
  }
  /** @param {Blob} file Original PDF. @returns {Promise<string>} Provider-ready data URL. */
  function pdfData(file){return new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onload=()=>resolve('data:application/pdf;base64,'+String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('Could not read the original PDF.'));reader.readAsDataURL(file);
  });}
  /** @param {object} doc Original document. @param {object[]} items Source-grounded extracted statements. */
  function citedText(doc,items){
    const references=[];
    /** @param {number[]} span Source offsets within this document. @returns {string} Reusable citation number. */
    function link(span){
      const locator=doc.id+':'+span[0]+':'+span[1];
      let index=references.findIndex(pair=>pair.endsWith('='+locator));
      if(index<0){index=references.length;references.push((index+1)+'='+locator);}
      return '['+(index+1)+']';
    }
    const text=items.map(item=>{
      const citations=[];
      if(item.basis)citations.push(link(item.basis));
      if(item.anchor)citations.push(link(item.anchor));
      return '- '+item.markdown+' '+([...new Set(citations)].join(' ')||'[verify source]');
    }).join('\n\n');
    return {text,ref:references.length?'msa:'+references.join('|'):''};
  }

  /** @returns {string} Choice of proof root and read-only supporting observations for this draft. */
  function paperChoices(){
    const review=state.paperReview;
    if(!review)return '';
    const options=[['primary_target','Main targets'],['secondary_target','Other formal results']].map(([kind,label])=>{
      const rows=review.targets.map((t,i)=>t.kind===kind?`<option value="${i}" ${i===review.index?'selected':''}>${esc(t.title)}</option>`:'').join('');
      return rows?'<optgroup label="'+label+'">'+rows+'</optgroup>':'';
    }).join('');
    return options?`<select id="paper-target" aria-label="Target for this run"><option value="-1" ${review.index===-1?'selected':''}>Enter a target manually</option>${options}</select>`:'<p>No formal target identified. Enter a target using Edit source.</p>';
  }

  /** @returns {string} Secondary reading material and source links, grouped outside the review steps. */
  function reviewDetails(){
    const notes=state.paperReview?.notes||[];
    const observations=['evaluation','example'].map(kind=>{
      const entries=notes.filter(row=>row.kind===kind);
      return entries.length?`<details><summary>${kind==='example'?'Worked examples':'Evaluation'} (${entries.length})</summary>${entries.map(row=>markdownView(row.text,row.ref)+(row.ref&&!row.ref.startsWith('msa:')?citeLink(row.ref):'')).join('')}</details>`:'';
    }).join('');
    const sources=Object.entries(inputFields).map(([key,title])=>{
      const links=citeLink(state.draftRefs[key+'Ref'],true);
      return links?`<div><strong>${esc(title)}</strong> ${links}</div>`:'';
    }).join('');
    const matches=state.draftRoute==='prosa'&&Object.values(state.inputDraft).some(Boolean)?'<div data-review-matches></div>':'';

  const reuseCache=new Map();

  /** @param {File} file New local source, saved before the user can assign excerpts. */

  /** Render the selected module using example records and local-only controls.

  /** @param {Object} row IR statement. @param {string} value Readable relation with local formula references. */

  /** Draw all graph connectors using measured node bounds.
   * @returns {void}
   */
  function drawGraphs(){

    root.querySelectorAll('.graph').forEach(container=>{
      /** @type {SVGElement} Connector layer for the current graph. */
      const svg=container.querySelector('.wires');
      /** @type {DOMRect} Diagram bounds in the current responsive layout. */
      const bounds=container.getBoundingClientRect();
      if(!bounds.width||!bounds.height)return;
      /** @type {Array<Array<string>>} Edges belonging to the stage canvas or a selected artifact. */
      const edges=container.id==='rt-flow'?flowEdges:JSON.parse(container.dataset.edges||'[]');
      svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
      svg.innerHTML=edges.map(([from,to])=>{
        /** @type {HTMLElement|null} Start node. */
        const start=container.querySelector(`[data-graph-node="${from}"]`);
        /** @type {HTMLElement|null} End node. */
        const end=container.querySelector(`[data-graph-node="${to}"]`);
        if(!start||!end)return '';
        /** @type {DOMRect} Source node geometry. */
        const a=start.getBoundingClientRect();
        /** @type {DOMRect} Destination node geometry. */
        const b=end.getBoundingClientRect();
        /** @type {boolean} True when a vertical connector best matches the node arrangement. */
        const vertical=Math.abs(a.left-b.left)<5;
        /** @type {number} Source connector x coordinate. */
        const x1=(vertical?a.left+a.width/2:a.right)-bounds.left;
        /** @type {number} Source connector y coordinate. */
        const y1=(vertical?a.bottom:a.top+a.height/2)-bounds.top;
        /** @type {number} Destination connector x coordinate. */
        const x2=(vertical?b.left+b.width/2:b.left)-bounds.left;
        /** @type {number} Destination connector y coordinate. */
        const y2=(vertical?b.top:b.top+b.height/2)-bounds.top;
        /** @type {string} Orthogonal artifact-dependency path. */
        const line=vertical?`M${x1} ${y1}V${y2-4}`:`M${x1} ${y1}H${(x1+x2)/2}V${y2}H${x2-4}`;
        /** @type {string} Small open arrow, authored as graph geometry. */
        const arrow=vertical?`M${x2-3} ${y2-7}L${x2} ${y2-3}L${x2+3} ${y2-7}`:`M${x2-7} ${y2-3}L${x2-3} ${y2}L${x2-7} ${y2+3}`;
        /** @type {string} Highlight only dependencies adjacent to the current selection. */
        const active=(container.id==='rt-flow'?[from,to].includes(state.stage):[from,to].includes(state.claim))?'relevant':'';
        return `<path class="${active}" d="${line}"/><path class="${active}" d="${arrow}"/>`;
      }).join('');
    });
  }

    const field=event.target.elements.projectName;

    if(!name||projects.some(item=>item.name.toLowerCase()===name.toLowerCase())){
      field.setCustomValidity(name?'A project with this name already exists.':'Enter a project name.');
      field.reportValidity();return;
    }
    /** @type {Object} New project uses an immutable ID independent of the display name. */
    const next={id:crypto.randomUUID(),name,description:event.target.elements.description.value.trim(),workspace:null};
    projects.unshift(next);openProject(next);navigate('documents');state.documentTab='pdf';render();remember();
  });
  root.addEventListener('keydown',event=>{
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-map-lemma],[data-map-goal]')){
      event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    }
  });
  root.addEventListener('click',async event=>{
    /** Activate graph nodes through their native pointer and keyboard events. */
    const mapped=event.target.closest('[data-map-goal],[data-map-lemma]');
    if(mapped){
      const key=project.irKeys?.[state.activeId],version=argumentVersions.get(key)||2;
      const view=reasoningViews.get(argumentKey(key,version));if(!view?.graph)return;
      const graph=view.graph,lemma=mapped.dataset.mapLemma;
      const focus=argumentReader.focusOf(graph,view);
      const whole=!!mapped.closest('.full-network');
      const filtered=whole&&view.networkFilter&&view.networkFilter!=='All';
      const related=graph.connections.filter(link=>lemma?link.forward===lemma&&(!mapped.dataset.context||link.backward===mapped.dataset.context):link.backward===mapped.dataset.mapGoal);
      const eligible=filtered?related.filter(link=>(({aligned:'Matches',open:'Gap'})[link.status]||link.status)===view.networkFilter):related;
      const available=eligible.length?eligible:related;
      const route=available.find(link=>link.backward===focus.target.id&&link.forward===focus.pair?.forward)||available.find(link=>link.backward===focus.target.id)||available[0];
      const target=mapped.dataset.mapGoal||route?.backward;
      if(filtered&&!eligible.length)view.networkFilter='All';
      if(!target){
        view.selected=lemma;view.section='forward';view.goalContext=focus.target.id;view.pairIndex=null;
        navigate('runs');state.runTab='derivation';syncArgumentLink(version,lemma);render();remember();
        root.querySelector('#arg-record')?.focus();return;
      }
      view.selected=target;view.lemma=lemma||null;
      if(target!==focus.target.id||lemma!==focus.pair?.forward)view.pairIndex=null;
      if(filtered&&eligible.length){view.lemma=route.forward;view.pairIndex=graph.connections.indexOf(route);}
      syncArgumentLink(version,target);render();
      if(whole){const picker=root.querySelector('[data-goal-picker]');picker?.focus({preventScroll:true});picker?.scrollIntoView({block:'nearest'});}
      else root.querySelector('.near-network '+(lemma?'[data-map-lemma]':'[data-map-goal]')+'[aria-pressed=true]')?.focus({preventScroll:true});
      return;
    }
    /** @type {HTMLButtonElement|null} Action selected with a pointer or keyboard. */
    const button=event.target.closest('button');if(!button||button.type==='submit')return;
    const argKey=project.irKeys?.[state.activeId], edition=argumentVersions.get(argKey)||2;
    if(button.hasAttribute('data-reload-audit')){ledger.invalidate(argKey);if(argKey&&button.dataset.version)void audit.load({project:project.id,run:state.activeId,key:argKey,version:Number(button.dataset.version)});render();return;}
    if(button.dataset.proofStage||button.dataset.proofNode){
      const node=button.dataset.proofNode;
      audit.select({key:argKey,version:Number(button.dataset.version)},button.dataset.proofStage||(node==='target_claim'?'final':'lemmas'),node);
      const selected=root.querySelector('[data-proof-node][aria-pressed="true"]');
      if(node&&selected)selected.focus({preventScroll:true});
      return;
    }
    if(button.dataset.workflow||button.dataset.workflowSettings){
      const bound={key:argKey,version:Number(button.dataset.version),project:project.id,run:state.activeId};
      if(button.dataset.workflow)void audit.load(bound,button.dataset.workflow,{scope:button.dataset.proofScope||'auto',nodeId:button.dataset.proofTarget});
      else audit.configure(bound,button.dataset.workflowSettings).catch(error=>{
        const note=document.createElement('p');note.textContent=error.message;button.after(note);
      });
      return;
    }
    if(button.dataset.refineArgument){
      const ctx={key:argKey,owner:project,run:state.activeId};
      button.disabled=true;
      try{
        const job=await modelRequest('run-skills',{key:argKey,project:project.id,run:ctx.run,parent:Number(button.dataset.refineArgument),fromReview:true});
        let progress;
        do{await new Promise(ok=>setTimeout(ok,1500));progress=await modelRequest('skill-progress',{id:job.id});}while(progress.stage==='running');
        if(progress.stage!=='ready')throw Error(progress.message||'Refinement interrupted.');
        if(project===ctx.owner&&state.activeId===ctx.run)openSkillRecord(ctx,progress.version,undefined,true);
      }catch(e){const msg=document.createElement('p');msg.textContent=e.message;button.after(msg);button.disabled=false;}
      return;
    }
    if(button.hasAttribute('data-reload-evidence')){ledger.invalidate(argKey);render();return;}
    if(button.dataset.mapFormat){
      const view=reasoningViews.get(argumentKey(argKey,edition));if(!view?.graph)return;
      view.mapFormat=button.dataset.mapFormat;render();
      root.querySelector('[data-map-format][aria-pressed=true]')?.focus({preventScroll:true});return;
    }
    if(button.dataset.networkFilter){
      const view=reasoningViews.get(argumentKey(argKey,edition));if(!view?.graph)return;
      view.networkFilter=button.dataset.networkFilter;render();
      root.querySelector('.run-totals [aria-pressed=true]')?.focus({preventScroll:true});return;
    }
    if(button.hasAttribute('data-show-overview')){const section=root.querySelector('#run-graph-overview');section?.focus({preventScroll:true});section?.scrollIntoView({block:'start'});return;}
    if(button.dataset.skillAction){void skillUI.handle(button.dataset.skillAction,button.dataset.skillId);return;}
    if(button.dataset.moduleAction==='retry-argument-read'){reasoningViews.delete(argumentKey(argKey,edition));render();return;}
    if(button.dataset.lemma||button.dataset.localCheck!==undefined){
      const view=reasoningViews.get(argumentKey(argKey,edition));if(!view?.graph)return;
      if(button.dataset.localCheck!==undefined){
        const trail=button.dataset.trail?button.dataset.trail.split(',').map(Number):[];
        void argumentReader.loadCheck(view.graph,Number(button.dataset.localCheck),true,trail);return;
      }
      view.selected=argumentReader.focusOf(view.graph,view).target.id;view.lemma=button.dataset.lemma||null;view.pairIndex=null;
      syncArgumentLink(edition,view.selected);render();root.querySelector('.lemma-options [aria-pressed=true]')?.focus({preventScroll:true});return;
    }
    if(button.dataset.argPair!==undefined){
      const view=reasoningViews.get(argumentKey(argKey,edition));
      if(view?.graph){view.pairIndex=Number(button.dataset.argPair);render();root.querySelector('.dag-options [aria-pressed="true"]')?.focus({preventScroll:true});}
      return;
    }
    if(button.dataset.argVersion){
      const v=Number(button.dataset.argVersion);
      argumentVersions.set(argKey,v);
      syncArgumentLink(v);render();return;
    }
    if(button.dataset.argSection||button.dataset.argTarget||button.dataset.dagNode){
      const view=reasoningViews.get(argumentKey(argKey,edition)),g=view?.graph;
      if(!g)return;
      const section=button.dataset.argSection,target=button.dataset.argTarget;
      if(section){
        view.section=section;
        if(section!=='alignment'&&!g[section].some(s=>s.id===view.selected))view.selected=g[section][0].id;
      }else{
        if(state.page==='derivation')view.goalContext=argumentReader.focusOf(g,view).target.id;
        view.selected=button.dataset.argId||button.dataset.dagNode;view.pairIndex=null;
        view.section=g.forward.some(s=>s.id===view.selected)?'forward':'backward';
        if(target==='detail'){navigate('runs');state.runTab='derivation';}
        if(target==='map')navigate('derivation');
      }
      syncArgumentLink(edition,view.selected);render();remember();
      const dest=target==='detail'?root.querySelector('#arg-record'):target==='map'?root.querySelector('[data-goal-picker]'):button.dataset.dagNode?root.querySelector('#dag-inspector'):null;
      if(dest){dest.focus({preventScroll:true});if(target||matchMedia('(max-width:1150px)').matches)dest.scrollIntoView({block:'nearest'});}
      return;
    }
    if(button.dataset.moduleAction==='start-derivation'){
      const ir=irViews.get(irIdentity(project,state.activeId))?.ir;if(ir)fetchArgument(ir,true,edition);return;
    }
    if(button.dataset.turn){const doc=reportPreviewDocument();if(doc){sourcePages.set(doc.id,Math.max(1,Math.min(doc.units.length,documentPage(doc)+Number(button.dataset.turn))));render();}return;}
    if(button.dataset.moduleAction==='openai-settings'){connectionDialog();return;}
    if(button.dataset.moduleAction==='retry-preparation'){loadIR(project,state.activeId,true);return;}
    if(button.dataset.moduleAction==='export-ir'){downloadIR();return;}
    if(button.dataset.moduleAction==='generate-msa'){generateDraft();return;}
    if(button.dataset.moduleAction==='recheck-paper'){
      const owner=project,doc=selectedDocument();
      if(doc&&!paperChecks.has(doc)){
        try{
          const file=await originalPdf(doc.id,undefined,owner.id);
          if(!file)throw Error('Re-import the original PDF to check the certificate again.');
          await checkPaperCertificate(owner,doc,file);
        }catch(error){
          const message=root.querySelector('#av-feedback');
          if(message)message.textContent=error.message;
        }
      }
      return;
    }
    if(button.dataset.cite){
      const ref=button.dataset.cite,hit=citation(ref);
      if(state.page==='verification'&&hit){
        reportCitation=ref;
        let offset=0;
        for(const [i,text] of hit.doc.units.entries()){
          if(hit.start<offset+text.length+1){sourcePages.set(hit.doc.id,i+1);break;}
          offset+=text.length+1;
        }
        render();root.querySelector('[data-report-excerpt]')?.focus();
      }else showSource(ref);
      return;
    }
    if(button.dataset.projectReport){
      const owner=projects.find(item=>item.id===button.dataset.projectReport);
      if(owner){
        openProject(owner);
        if(button.dataset.paperReport){
          owner.selectedDocument=button.dataset.paperReport;
          const doc=selectedDocument();
          sourcePages.set(doc.id,doc.paperVerification.claim.page);
        }
        selectRun(Number(button.dataset.reportRun||0));navigate('verification');
        state.verificationTab=button.dataset.reportTab||'status';
        render();remember();
      }
      return;
    }
    if(button.dataset.editMsa){const section=button.closest('[data-msa-field]');setSourceMode(section,section.querySelector('textarea').hidden);return;}
    if(button.dataset.assign){
      const viewer=root.querySelector('#source-text'),key=button.dataset.assign;
      const start=viewer.selectionStart,end=viewer.selectionEnd,quote=viewer.value.slice(start,end);
      if(!quote.trim()||quote.length>1800){root.querySelector('#av-feedback').textContent='Select a passage of 1–1800 characters.';return;}
      startInput();state.inputDraft[key]=quote;state.draftRefs[key+'Ref']=selectedDocument().id+':'+start+':'+end;
      state.draftSource='Document excerpts';inputPane='inputs';render();remember();setSourceMode(root.querySelector('[data-msa-field="'+key+'"]'),true);return;
    }
    if(button.dataset.deleteProject){confirmProjectDeletion(projects.find(item=>item.id===button.dataset.deleteProject));return;}
    if(button.dataset.project)openProject(projects.find(item=>item.id===button.dataset.project));
    if(button.dataset.page){
      if(button.dataset.record&&state.page==='resources')openProject(projects.find(item=>item.id==='example'));
      if(button.dataset.record){selectRun(Number(button.dataset.record));state.runTab=button.dataset.page==='compare'?'compare':'summary';state.modelTab='model';}
      if(button.dataset.page==='modeling')state.reviewing=false;
      navigate(button.dataset.page==='compare'?'runs':button.dataset.page);
    }
    if(button.dataset.tabField){state[button.dataset.tabField]=button.dataset.tabValue;feedback='';}
    if(button.dataset.openStage){if(state.page!=='derivation')state.route=recordFor(state.activeId).route;navigate('derivation');selectStage(button.dataset.openStage,Number(button.dataset.openOutput||0));state.view='workflow';state.focus=false;}
    switch(button.dataset.moduleAction){
      case 'import-mode':state.documentTab='pdf';break;
      case 'manual-mode':state.documentTab='manual';reading++;readStatus='';break;
      case 'extract':state.documentTab='extract';inputPane='source';break;
      case 'source-pane':inputPane='source';break;
      case 'inputs-pane':inputPane='inputs';break;
      case 'scope-option':chooseTimeScope();return;
      case 'new-project':creating=true;break;
      case 'prosa':openProject(projects.find(item=>item.id==='example'));selectRun(3);state.route='prosa';navigate('derivation');selectStage('proof');state.view='workflow';break;
      case 'revise':prepareDraft();editFields();break;
      case 'enter-fields':editFields();break;
      case 'example-input':
        startInput();state.paperReview=null;state.inputDraft=Object.fromEntries(Object.keys(inputFields).map(key=>[key,exampleRun[key]||'']));state.draftSource=exampleRun.source;state.draftRefs={};break;
      case 'discard':clearDraft();editFields();break;
      case 'freeze':{
        /** @type {Object} Restore the review if storage cannot commit its input snapshot. */
        if(!reviewInputs())return;
        const draft=structuredClone(state);freezeDraft();
        if(!remember()){Object.assign(state,draft);project.workspace=structuredClone(draft);feedback='Could not save these inputs. Browser storage is full or unavailable.';render();return;}
        break;
      }
    }
    if(button.dataset.stage)selectStage(button.dataset.stage);
    if(button.dataset.output!==undefined){state.artifact=Number(button.dataset.output);state.detail='preview';}
    if(button.dataset.detail)state.detail=button.dataset.detail;
    if(button.dataset.view){state.view=button.dataset.view;state.focus=false;}
    if(button.dataset.claim)state.claim=button.dataset.claim;
    if(button.dataset.catalogStage){selectStage(button.dataset.catalogStage,Number(button.dataset.catalogOutput));state.view='workflow';state.focus=true;}
    if(button.dataset.action==='gap'){selectStage('alignment');state.view='workflow';state.focus=false;}
    if(button.dataset.action==='focus')state.focus=!state.focus;
    if(button.dataset.action==='sidebar')state.navHidden=!state.navHidden;
    if(button.dataset.action==='clear-search'){state.query='';root.querySelector('#rt-search').value='';}
    /** @type {boolean} Narrow screens open artifact detail directly instead of stacking it below the canvas. */
    const openMobileDetail=Boolean(button.dataset.stage||button.dataset.catalogStage||button.dataset.openStage||button.dataset.action==='gap')&&window.matchMedia('(max-width:600px)').matches;
    if(openMobileDetail)state.focus=true;
    render();remember(button.dataset.moduleAction==='freeze');
    if(creating)root.querySelector('[name=projectName]').focus();

    if(['enter-fields','revise','example-input','discard'].includes(button.dataset.moduleAction))root.querySelector('[data-edit-msa="model"]').focus({preventScroll:true});
    if(button.dataset.moduleAction==='freeze')loadIR(project,state.activeId,true);
    // Recreated artifact controls retain keyboard focus after their content changes.
    if(button.dataset.output!==undefined)root.querySelector(`[data-output="${state.artifact}"]`)?.focus({preventScroll:true});
    if(button.dataset.claim)root.querySelector(`[data-claim="${state.claim}"]`)?.focus({preventScroll:true});
    if(button.dataset.catalogStage)root.querySelector('[data-action="focus"]').focus({preventScroll:true});
    if(button.dataset.action==='clear-search')root.querySelector('#rt-search').focus({preventScroll:true});
    if(openMobileDetail)root.querySelector(`[data-output="${state.artifact}"]`)?.focus({preventScroll:true});
    // Recreated navigation and page tabs retain a predictable keyboard focus target.
    if(button.dataset.page){
      root.querySelector(`.rail [data-page="${state.page}"]`)?.focus({preventScroll:true});
      if(window.matchMedia('(max-width:780px)').matches)root.querySelector('.mobile-nav summary').focus({preventScroll:true});
    }
    if(button.dataset.tabField)root.querySelector(`[data-tab-field="${button.dataset.tabField}"][data-tab-value="${button.dataset.tabValue}"]`)?.focus({preventScroll:true});
  });
  root.addEventListener('input',event=>{
    /** @type {HTMLInputElement|HTMLTextAreaElement} Editable local preview field. */
    const field=event.target;
    if(field.name==='projectName')field.setCustomValidity('');
    if(field.dataset.inputField){
      startInput();state.inputDraft[field.dataset.inputField]=field.value;field.removeAttribute('aria-invalid');field.removeAttribute('aria-describedby');
      feedback='';root.querySelector('#av-feedback').textContent='';
      remember();
    }
    if(field.dataset.reference){state.draftRefs[field.dataset.reference]=field.value.trim();remember();}
    if(field.id==='av-revision-note'){state.draftNote=field.value;remember();}
    if(field.id==='av-latex'){
      state.latex=field.value;
      root.querySelector('#av-latex-preview').innerHTML=math(state.latex,true);
      renderMath();remember();
    }
  });
  root.addEventListener('change',event=>{
    /** @type {HTMLInputElement|HTMLSelectElement} File or preference control. */
    const field=event.target;
    if(field.hasAttribute('data-audit-limit')){
      audit.options({key:project.irKeys[state.activeId],version:Number(field.dataset.version)}).limit=Number(field.value);return;
    }
    if(field.matches('[data-goal-picker],[data-route-picker]')){
      const key=project.irKeys?.[state.activeId],edition=argumentVersions.get(key)||2,view=reasoningViews.get(argumentKey(key,edition));if(!view?.graph)return;
      const goal=field.hasAttribute('data-goal-picker');
      if(goal){view.selected=field.value;view.lemma=null;view.pairIndex=null;}
      else{view.pairIndex=Number(field.value);view.lemma=view.graph.connections[view.pairIndex].forward;view.selected=view.graph.connections[view.pairIndex].backward;}
      syncArgumentLink(edition,view.selected);render();root.querySelector(goal?'[data-goal-picker]':'[data-route-picker]')?.focus({preventScroll:true});return;
    }
    if(field.id==='av-paper-upload'&&field.files?.[0]){importPaperProject(field.files[0]);return;}
    if(field.id==='av-file'&&field.files?.[0]){importFile(field.files[0]);return;}
    if(field.id==='paper-target'){
      const review=state.paperReview,index=Number(field.value);
      const previous=review.targets[review.index]||review.manual;
      Object.assign(previous,{text:state.inputDraft.goal,ref:state.draftRefs.goalRef||''});
      const next=review.targets[index]||review.manual;
      review.index=index;state.inputDraft.goal=next.text;state.draftRefs.goalRef=next.ref;
      remember();render();root.querySelector('#paper-target')?.focus();return;
    }
    if(field.id==='source-choice'){project.selectedDocument=field.value;reading++;readStatus='';render();remember();return;}
    if(field.id==='av-draft-route'){startInput();state.draftRoute=field.value;remember();render();}
    if(field.id==='av-run-select'){selectRun(Number(field.value));render();remember();root.querySelector('#av-run-select').focus({preventScroll:true});}
    if(field.id==='av-appearance'){state.appearance=field.value;render();remember();root.querySelector('#av-appearance').focus();}
  });
  root.querySelector('#rt-route').addEventListener('change',event=>{state.route=event.target.value;if(state.stage==='proof')state.claim='target';render();remember();});
  root.querySelector('#rt-stage-select').addEventListener('change',event=>{selectStage(event.target.value);render();remember();});
  root.querySelector('#rt-search').addEventListener('input',event=>{state.query=event.target.value;renderCatalog();if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});remember();});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.page==='derivation'&&state.focus){state.focus=false;render();remember();root.querySelector('[data-action="focus"]').focus();}});
  /** @type {string} Origin-local storage for the standalone AutoVISA workspace. */
  const storageKey='autovisa.workspace.v4';
  try{
    /** @type {Object|null} Older single-project saves belong to the seeded case study. */
    const saved=JSON.parse(localStorage.getItem(storageKey));
    if(Array.isArray(saved?.projects)){
      projects=saved.projects.filter(item=>!wasDeleted(item.id));project=projects.find(item=>item.id===saved.current)||projects[0]||{id:null};
      if(projects.length!==saved.projects.length)localStorage.setItem(storageKey,JSON.stringify({projects,current:project.id}));
      restore(project.workspace&&{...project.workspace,designVersion:4});
    }else restore(saved);
  }catch{/* A fresh tab can run without storage. */}
  /** Optional deep link to a locally stored project and immutable run. */
  let argumentStart=null;
  const targetParams=new URLSearchParams(location.search);
  if(targetParams.get('view')==='verification'&&targetParams.has('paper')){
    const target=projects.find(item=>item.id===targetParams.get('project'));
    const doc=target?.documents?.find(item=>item.id===targetParams.get('paper')&&item.paperVerification);
    if(doc){openProject(target);target.selectedDocument=doc.id;selectRun(0);navigate('verification');}
  }
  if(['ir','msa','run','proof-details','derivation','derivation-record','verification','expert-audit','overview'].includes(targetParams.get('view'))){
    const target=projects.find(p=>p.id===targetParams.get('project')||p.name===targetParams.get('project'));
    if(target&&!targetParams.has('paper')){openProject(target);const run=Number(targetParams.get('run'));if(recordFor(run).id===run&&run>0){selectRun(run);const key=target.irKeys?.[run],version=Number(targetParams.get('version'))||2;
      if(key){if(targetParams.has('version')&&Number.isSafeInteger(version)&&version>0)argumentVersions.set(key,version);argumentStart={key,version,step:targetParams.get('step'),lemma:targetParams.get('lemma'),goal:targetParams.get('goal'),pairIndex:targetParams.has('route')?Number(targetParams.get('route')):null};}
      state.runTab=({'derivation-record':'derivation','proof-details':'proof-details',ir:'ir'})[targetParams.get('view')]||'summary';state.modelTab='model';navigate(({msa:'modeling',derivation:'derivation',verification:'verification','expert-audit':'expert-audit',overview:'overview'})[targetParams.get('view')]||'runs');}}
  }
  if(targetParams.get('view')==='projects'||(targetParams.has('project')&&!projects.some(item=>item.id===targetParams.get('project')||item.name===targetParams.get('project'))))navigate('projects');
  if(targetParams.get('view')==='skills'){navigate('resources');state.resourceTab='skills';}
  if(new URLSearchParams(location.search).get('start')==='new'){navigate('projects');creating=true;history.replaceState(null,'',location.pathname);}
  root.querySelector('#rt-search').value=state.query;
  render();
  window.addEventListener('DOMContentLoaded',()=>{
    if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});
    renderMath();requestAnimationFrame(drawGraphs);
  });
  document.getElementById('av-katex').addEventListener('load',()=>{renderMath();requestAnimationFrame(drawGraphs);});
  if(window.ResizeObserver){diagramObserver=new ResizeObserver(drawGraphs);diagramObserver.observe(root);}else window.addEventListener('resize',drawGraphs);
})();
</script>
