#rt-workspace .step-row:hover{color:var(--rt-blue)}#rt-workspace .step-row .step-copy{display:grid;gap:3px;flex:1;font-size:13px}#rt-workspace .step-copy small{color:var(--rt-muted);font-size:12px}
#rt-workspace .step-num{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border:1px solid var(--rt-line);border-radius:50%;font-size:12px;flex-shrink:0;color:var(--rt-muted)}
#rt-workspace .page-content textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--rt-line);border-radius:7px;padding:10px 12px;background:var(--rt-panel);color:var(--rt-ink);font:13px/1.6 Inter,'Segoe UI',sans-serif;caret-color:var(--rt-blue)}
#rt-workspace textarea:focus-visible{outline:3px solid var(--rt-blue);outline-offset:3px}

#rt-workspace .upload-zone{border:1px dashed var(--rt-line);border-radius:10px;padding:25px 20px;text-align:center;background:var(--rt-panel);display:grid;justify-items:center;gap:12px}

#rt-workspace .section-note{font-size:12px;color:var(--rt-muted);padding:12px 0}

#rt-workspace .help-item summary{cursor:pointer;font-weight:500}#rt-workspace .help-item p{padding-top:10px;color:var(--rt-muted);max-width:65ch}
#rt-workspace .run-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 0;border-bottom:1px solid var(--rt-line);font-size:12px}#rt-workspace .run-row strong{flex:1;font-size:13px}
#rt-workspace .latex-block{max-width:100%;overflow-x:auto;padding:8px 0;font-size:17px;scrollbar-color:var(--rt-line) transparent}
#rt-workspace .latex-inline{font-size:1em}#rt-workspace .katex-display{margin:.35em 0}#rt-workspace .mathbox .latex-block{font-size:17px}
#rt-workspace .formula .latex-block{font-size:18px}#rt-workspace .formula{overflow-wrap:normal}
#rt-workspace .mobile-nav .navrow{min-height:44px}#rt-workspace .mobile-nav[open]{width:100%}

@media(max-width:780px){#rt-workspace .shell{grid-template-columns:1fr}#rt-workspace .page-content{padding:3px 16px 24px;min-height:470px}#rt-workspace .split{grid-template-columns:1fr}#rt-workspace .project-entry{gap:15px}#rt-workspace .rail{min-height:0}}
@media(max-width:480px){#rt-workspace .project-entry,#rt-workspace .resource-row{grid-template-columns:1fr}#rt-workspace .surface{padding:16px}#rt-workspace .previewmark{display:none}#rt-workspace .page-content textarea{font-size:16px}}

#rt-workspace .av-fields{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:0;margin:0}#rt-workspace .av-fields>*{margin:0;border-top:1px solid var(--rt-line);padding:12px 0}#rt-workspace .av-fields dt{font-weight:600}#rt-workspace .av-fields dd{white-space:pre-wrap;overflow-wrap:anywhere}
#rt-workspace .av-picker{width:min(22rem,100%)}#rt-workspace .av-trailing{display:inline-flex;align-items:center;gap:6px;margin-left:auto;text-align:right}

@media(max-width:600px){#rt-workspace .av-fields{grid-template-columns:1fr}#rt-workspace .av-fields dt{padding-bottom:0}#rt-workspace .av-fields dd{border-top:0;padding-top:4px}#rt-workspace .module-tabs{column-gap:12px;row-gap:0}#rt-workspace .artifact-foot{flex-wrap:wrap;gap:8px}}
#rt-workspace .stage-status:empty{display:none}#rt-workspace .artifact-content table{font-size:13px;line-height:1.55}
#rt-workspace .treeleaf>span:last-child:not([data-tex]){font-size:12px}#rt-workspace .field [aria-invalid="true"]{border-color:var(--rt-amber)}
#rt-workspace .av-reference{margin-top:7px;color:var(--rt-blue);font-size:13px}#rt-workspace .help-item[open]>.stack{padding-top:12px}#rt-workspace .field input[type="text"]{padding:8px 10px}
#rt-workspace .rail-chevron{font:24px/1 'Segoe UI',sans-serif}#rt-workspace .navrow{font-size:14px}#rt-workspace .project-nav .navrow{font-size:13px;color:var(--rt-ink)}#rt-workspace .project-nav .navrow.active{color:var(--rt-blue)}
#rt-workspace math{font-family:'Cambria Math',math,serif;color:var(--rt-ink)}#rt-workspace math[display="block"]{margin:0 auto}

</head>
<body>
<div id="rt-workspace" aria-label="AutoVISA research workspace">
  <div class="shell">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand">AutoVISA</div>
      <nav id="av-navigation" class="navgroup" aria-label="Workspace navigation"></nav>
      <nav id="av-utilities" class="railfoot" aria-label="Utilities"></nav>
    </aside>
    <main class="main">
      <div class="topbar"><div class="breadcrumb"><button type="button" class="control quiet icon-only sidebar-toggle" data-action="sidebar" aria-label="Collapse navigation" aria-expanded="true"><span class="rail-chevron" aria-hidden="true">‹</span></button><span id="av-breadcrumb" class="breadcrumb"></span></div><span class="previewmark">Interactive preview</span><details class="mobile-nav"><summary>Navigation</summary><nav id="av-mobile-links" aria-label="Mobile navigation"></nav></details></div>
      <section id="av-module-page" aria-label="Current module"></section>
      <section id="av-derivation-page" hidden>
      <div class="pagehead"><div class="headinggroup"><h1>Derivation</h1></div><div class="toolbar route-control"><label class="small muted">Explore route <select id="rt-route" aria-label="Proof route"><option value="independent">Independent</option><option value="prosa">Prosa reuse</option></select></label><button type="button" class="control primary" data-action="gap"><i data-lucide="git-merge" aria-hidden="true"></i>Review gap</button></div></div>
      <div class="viewbar"><div class="viewtabs" aria-label="Workspace views"><button type="button" class="viewtab" data-view="workflow" aria-pressed="true">Workflow</button><button type="button" class="viewtab" data-view="artifacts" aria-pressed="false">Artifacts</button></div><div class="route-meta"><span>Run 03</span><span>·</span><span id="rt-version">Independent v2</span><span>·</span><span>Context v2</span></div></div>
      <section id="rt-workflow-view">
        <section class="canvasarea" aria-label="Derivation workflow"><div id="rt-flow" class="graph" aria-label="Seven selectable derivation stages"><svg class="wires" aria-hidden="true"></svg></div></section>
        <section class="artifact-panel" id="rt-artifact-panel" aria-label="Selected stage and its artifacts">
          <div class="stagehead"><div class="stageheading"><h2 id="rt-stage-title">Forward reasoning</h2><span class="count" id="rt-output-count">3 outputs</span></div><div class="toolbar"><label class="stagepicker small muted">Stage<select id="rt-stage-select" aria-label="Select stage in focus mode"></select></label><button type="button" class="control quiet" data-action="focus" aria-expanded="false"><i data-lucide="maximize-2" aria-hidden="true"></i><span id="rt-focus-label">Focus</span></button></div></div>
          <div class="artifact-layout"><nav class="artifact-list" aria-label="Stage outputs"><div class="artifact-list-label">Outputs</div><div id="rt-output-list" style="display:contents"></div></nav><div class="artifact-body"><div class="artifact-titlebar"><div class="artifact-title"><h3 id="rt-artifact-title">Claim graph</h3><span class="status" id="rt-artifact-status">Draft</span></div><div class="detailtabs" aria-label="Artifact views"><button type="button" class="detailtab" data-detail="preview" aria-pressed="true">Preview</button><button type="button" class="detailtab" data-detail="details" aria-pressed="false">Details</button><button type="button" class="detailtab" data-detail="sources" aria-pressed="false">Sources</button></div></div><div id="rt-artifact-content" class="artifact-content" aria-live="polite"></div><div class="artifact-foot"><span id="rt-artifact-id"></span><div id="av-next-output"></div></div></div></div>
        </section>
      </section>
      <section id="rt-catalog-view" class="catalog" hidden><div class="catalog-head"><h2>All artifacts</h2><label class="small muted">Find an artifact <input id="rt-search" type="search" placeholder="Name or stage" autocomplete="off"></label></div><div class="catalog-row catalog-labels" aria-hidden="true"><span>Artifact</span><span>Stage</span><span class="kind">Type</span></div><div id="rt-catalog-rows"></div><div id="rt-no-results" class="blank" hidden><strong>No matching artifacts</strong><p>Try a stage name such as Forward.</p><button type="button" class="control" data-action="clear-search" style="margin-top:12px">Clear search</button></div></section>
      </section>
    </main>
  </div>
</div>
<script>
(() => {
  /** @type {HTMLElement} Root element for this interactive design, isolated from the product app. */
  const root = document.getElementById('rt-workspace');
  /** @type {Object<string, Object>} Stage definitions and artifact ownership for the example route. */
  const stages = {
    context:{name:'Context',title:'Context',status:'Snapshot',cell:[1,2],inputs:['Selected model','Selected goal'],outputs:[['CTX-01','Model snapshot','Diagram','context'],['CTX-02','Scope & assumptions','Table','scope'],['CTX-03','Target statement','Statement','target'],['CTX-04','Source map','Table','sourcemap']]},
    forward:{name:'Forward',title:'Forward reasoning',status:'Draft',cell:[2,1],inputs:['Context v2','General lemmas'],outputs:[['FWD-01','Claim graph','Diagram','claims'],['FWD-02','Bound candidates','Table','bounds'],['FWD-03','Dependencies','Diagram','dependencies']]},
    backward:{name:'Backward',title:'Backward reasoning',status:'Draft',cell:[2,3],inputs:['Target statement','Context v2'],outputs:[['BWD-01','Goal tree','Diagram','goals'],['BWD-02','Open obligations','Table','obligations'],['BWD-03','Required premises','Table','premises']]},
    alignment:{name:'Alignment',title:'Alignment',status:'Needs review',cell:[3,2],inputs:['Forward claims','Backward obligations'],outputs:[['ALN-01','Correspondence map','Diagram','alignment'],['ALN-02','Gap list','Table','gaps'],['ALN-03','Scope checks','Table','conflicts']]},
    bridges:{name:'Bridges',title:'Bridge construction',status:'Open',cell:[4,2],inputs:['Alignment gap','Scheduling semantics'],outputs:[['BRG-01','Bridge candidate','Diagram','bridge'],['BRG-02','Review note','Statement','review'],['BRG-03','Impact map','Diagram','impact']]},
    proof:{name:'Proof',title:'Proof assembly',status:'Draft',cell:[5,1],inputs:['Claims and bridge lemmas','Allowed library resources'],outputs:[['PRF-01','Proof plan','Diagram','proof'],['PRF-02','Rocq source','Code','code'],['PRF-03','Library references','Table','libraries']]},
    check:{name:'Check',title:'Proof checking',status:'Not run',cell:[5,3],inputs:['Proof files','Versioned environment'],outputs:[['CHK-01','Goal status','Report','check'],['CHK-02','Checker log','Report','log'],['CHK-03','Assumption audit','Report','audit'],['CHK-04','Environment','Table','environment']]}
  };
  /** @type {Array<Array<string>>} Directed artifact dependencies, not mathematical implications. */
  const flowEdges = [['context','forward'],['context','backward'],['forward','alignment'],['backward','alignment'],['alignment','bridges'],['bridges','proof'],['proof','check']];
  /** @type {Object} Presentation state: page and per-module views, route selection, local input drafts and display preferences. */
  const state = {page:'projects',stage:'forward',artifact:0,detail:'preview',view:'workflow',route:'independent',focus:false,navHidden:false,query:'',claim:'workload',documentTab:'pdf',modelTab:'model',verificationTab:'status',resourceTab:'libraries',runTab:'summary',settingsTab:'general',latex:'A_j(r_j,d_j) \\ge C_j',inputDraft:{model:'',analysis:'',goal:''},appearance:'system'};
  /** @type {ResizeObserver|null} Observer keeping vector connectors attached to actual node positions. */
  let diagramObserver = null;
  /** @type {Object<string,Array<string>>} Page titles and navigation icons. */
  const pages = {
    projects:['Projects','folder-open'],
    overview:['Overview','layout-dashboard'],
    documents:['Documents','files'],
    modeling:['Modeling','sliders-horizontal'],
    derivation:['Derivation','workflow'],
    verification:['Verification','shield-check'],
    runs:['Runs','history'],
    resources:['Resources','library'],
    settings:['Settings','settings'],
    help:['Help','circle-help']
  };
  /** @type {Array<string>} Modules scoped to the selected project, nested under Projects. */
  const projectPages=['overview','documents','modeling','derivation','verification','runs'];
  /** @type {string} Local notification text; never interpreted as backend confirmation. */
  let feedback='';
  /** @type {Object<string,string>} Reviewable fields shared by manual input, snapshots and comparisons. */
  const inputFields={model:'Model',analysis:'Analysis',goal:'Goal'};
  /** @type {Object<string,string>} Optional paper locators attached to individual input fields. */
  const referenceFields={modelRef:'Model reference',analysisRef:'Analysis reference',goalRef:'Goal reference'};
  /** @type {Object} Fixed parent record; switching the diagram view never edits this record. */
  const exampleRun={id:3,parent:null,route:'independent',source:'case_11 scope',note:'',model:'Integer time. Independent sporadic tasks on one preemptive DM processor, with a fixed tie order and an empty initial system. Each job executes at most C, with 0 < C ≤ D ≤ T. No blocking, self-suspension or scheduling overhead.',analysis:'Accept when every task passes the iterative deadline test.',goal:'For every legal release trace, every job finishes by its deadline if the test accepts.'};
  Object.assign(state,{records:[],draftRefs:{},activeId:3,draftParent:3,draftRoute:'independent',reviewing:false,draftStarted:false,draftNote:'',draftSource:'Manual input'});
  /** Return an immutable input snapshot by resolving the changes against its parent.
   * @param {number} id Run identifier.
   * @returns {Object} Frozen input, source and route for this record.
   */
  function recordFor(id){
    if(id===3)return exampleRun;
    /** @type {Object} Stored changes for this run. */
    const entry=state.records.find(item=>item.id===id);
    return entry?{...recordFor(entry.parent),...entry}:exampleRun;
  }
  /** @param {number} id Run number. @returns {string} Display name. */
  function runName(id){return 'Run '+String(id).padStart(2,'0');}
  /** @param {string} route Saved proof strategy. @returns {string} Visible route name. */
  function routeName(route){return route==='prosa'?'Prosa reuse':'Independent';}
  /** @param {string} action Action key. @param {string} label Visible action. @param {boolean} primary Main action. @returns {string} Native button. */
  function actionButton(action,label,primary=false){return `<button type="button" class="control ${primary?'primary':''}" data-module-action="${action}">${label}</button>`;}
  /** @param {number} id Record to select. @param {string} label Button label. @param {string} page Destination module. @returns {string} Run-bound navigation. */
  function recordLink(id,label,page='runs'){return `<button type="button" class="control" data-record="${id}" data-page="${page}">${esc(label)}</button>`;}
  /** Start a working copy and preserve an existing unfinished draft. @returns {void} */
  function prepareDraft(){
    if(state.draftStarted)return;
    /** @type {Object} Historical parent of the new working copy. */
    const parent=recordFor(state.activeId);
    state.draftParent=parent.id;state.draftRoute=parent.route;state.draftSource=parent.source;state.draftNote='';
    state.inputDraft=Object.fromEntries(Object.keys(inputFields).map(key=>[key,parent[key]]));
    state.draftRefs=Object.fromEntries(Object.keys(referenceFields).map(key=>[key,parent[key]||'']));
    state.draftStarted=true;
  }
  /** @param {Object} parent Frozen parent. @param {Object} child Compared snapshot. @returns {Array<Array<string>>} Current parent-to-draft field changes without inferred analysis. */
  function changesBetween(parent,child){return Object.entries({...inputFields,...referenceFields,route:'Route',source:'Source',note:'Revision note'}).filter(([key])=>(parent[key]||'')!==(child[key]||'')).map(([key,label])=>[label,key==='route'?routeName(parent[key]):parent[key]||'—',key==='route'?routeName(child[key]):child[key]||'—']);}
  /** @returns {Object} Input snapshot currently under review. */
  function workingCopy(){
    /** @type {Object<string,string>} Explicit empty locators remove inherited references after changing a paper. */
    const references=Object.fromEntries(Object.keys(referenceFields).map(key=>[key,state.draftRefs[key]||'']));
    return {...state.inputDraft,...references,source:state.draftSource,route:state.draftRoute,note:state.draftNote.trim()};
  }
  /** Render LaTeX markup with an escaped, readable source fallback.
   * @param {string} tex LaTeX expression without delimiters.
   * @param {boolean} display Whether to use a separate display equation.
   * @returns {string} A rendering target retaining its original expression.
   */
  function math(tex,display=false){
    return `<span class="${display?'latex-block':'latex-inline'}" style="${display?'display:block':''}" data-tex="${esc(tex)}" data-display="${display}">${esc(tex)}</span>`;
  }
  /** Typeset known notation inside otherwise escaped table and graph labels.
   * @param {string} value Human-readable example text.
   * @returns {string} Escaped text with explicitly mapped formula spans.
   */
  function mathText(value){
    /** @type {Object<string,string>} Existing notation mapped without changing its meaning. */
    const notation={'0 < C ≤ D ≤ T':String.raw`0<C_i\le D_i\le T_i`,'e ≤ C':String.raw`e_j\le C_j`,'[rⱼ, dⱼ)':String.raw`[r_j,d_j)`,'eⱼ':String.raw`e_j`,'dⱼ':String.raw`d_j`,'rⱼ':String.raw`r_j`};
    /** @type {string} Escaped content, with only recognized expressions replaced. */
    let result=esc(value);
    Object.entries(notation).forEach(([label,tex])=>{result=result.replaceAll(esc(label),math(tex));});
    return result;
  }
  /** Typeset newly rendered expressions; a malformed formula cannot disable navigation.
   * @returns {void}
   */
  function renderMath(){
    if(!window.katex)return;
    root.querySelectorAll('[data-tex]:not([data-typeset])').forEach(element=>{
      try{
        window.katex.render(element.dataset.tex,element,{displayMode:element.dataset.display==='true',output:'mathml',throwOnError:true,trust:false,strict:'ignore'});
        element.dataset.typeset='true';
      }catch(error){
        element.textContent=element.dataset.tex;
        element.dataset.typeset='invalid';
        element.insertAdjacentHTML('beforeend','<span class="section-note"> — Check LaTeX syntax</span>');
      }
    });
  }
  /** Build a navigation control with the current page exposed to assistive technology.
   * @param {string} id Page identifier.
   * @returns {string} Native navigation button.
   */
  function navButton(id){
    return `<button type="button" class="navrow ${state.page===id?'active':''} ${id==='projects'&&projectPages.includes(state.page)?'parent-active':''}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(pages[id][1])}${pages[id][0]}</button>`;
  }
  /** Build compact page-local switches, preserving each module's selection.
   * @param {string} field State property owned by the page.
   * @param {Array<Array<string>>} options Stable values and visible labels.
   * @returns {string} An accessible group of pressed-state buttons.
   */
  function moduleTabs(field,options){
    return `<div class="module-tabs" role="group" aria-label="${pages[state.page][0]} views">${options.map(([value,label])=>`<button type="button" class="viewtab" data-tab-field="${field}" data-tab-value="${value}" aria-pressed="${state[field]===value}">${label}</button>`).join('')}</div>`;
  }
  /** Build a primary or secondary action that opens a specific derivation output.
   * @param {string} stage Destination workflow stage.
   * @param {string} label Visible action.
   * @param {boolean} primary Whether this is the page's main next step.
   * @returns {string} Route-preserving output link.
   */
  function stageLink(stage,label,primary=false){
    return `<button type="button" class="control ${primary?'primary':''}" data-open-stage="${stage}">${label}${icon('arrow-right')}</button>`;
  }
  /** Build a page navigation action.
   * @param {string} page Destination page.
   * @param {string} label Visible action.
   * @param {boolean} primary Whether to emphasize this action.
   * @returns {string} Native action button.
   */
  function pageLink(page,label,primary=false){
    return `<button type="button" class="control ${primary?'primary':''}" data-page="${page}">${label}${icon('arrow-right')}</button>`;
  }
  /** Render the selected module using example records and local-only controls.
   * @returns {string} Module body with no invented checker receipts or source locations.
   */
  function moduleBody(){
    /** @type {Object} Run selected across project modules. */
    const active=recordFor(state.activeId);
    /** @type {boolean} Only the seeded example contains derivation artifacts. */
    const hasArtifacts=active.id===exampleRun.id;
    /** @type {string} Reusable navigation from a project to its corresponding record. */
    const openRun=recordLink(active.id,runName(active.id));
    if(state.page==='projects')return `<div class="project-entry"><div><h2>case_11</h2><p>Deadline guarantee under DM scheduling</p></div>${pageLink('overview','Open project',true)}</div>`;
    if(state.page==='overview')return `<div class="stack"><div><h2>${hasArtifacts?'Deadline guarantee':'Current goal'}</h2><p class="av-statement">${esc(active.goal)}</p></div>
      <div class="av-next"><div><h3>${hasArtifacts?'Available service → job completion':'Inputs frozen'}</h3><p>${hasArtifacts?'One scheduling bridge is open.':esc(runName(active.id))+' · Derivation pending'}</p></div>${hasArtifacts?stageLink('alignment','Review gap',true):pageLink('runs','Inspect run',true)}</div>
      <section><h3>Current record</h3><div class="run-row">${openRun}<span>${routeName(active.route)}</span><span class="status">${hasArtifacts?'Draft proof':'Inputs only'}</span></div></section><div class="action-row">${pageLink('documents','Open inputs')}</div></div>`;
    if(state.page==='documents')return `${moduleTabs('documentTab',[['pdf','Paper PDF'],['manual','Manual input']])}
      ${state.documentTab==='pdf'?`<div class="stack"><div class="upload-zone">${icon('file-up')}<label class="field">Choose a PDF reference<input id="av-pdf" type="file" accept=".pdf,application/pdf"></label></div>
      <div class="av-next"><div><h3 id="av-pdf-name">${state.draftSource.startsWith('PDF · ')?esc(state.draftSource.slice(6)):'Paper reference'}</h3><p>Enter the model, analysis and goal from the paper.</p></div>${actionButton('enter-fields','Enter fields',true)}</div></div>`:
      `<div id="av-input-form" class="stack" role="group" aria-label="Inputs for review"><div class="av-title"><h2>Input draft</h2><span class="status">From ${runName(state.draftStarted?state.draftParent:state.activeId)}</span></div>${Object.entries(inputFields).map(([key,label])=>`<label class="field">${label}<textarea name="${key}" data-input-field="${key}" required maxlength="1800" placeholder="${({model:'Tasks, arrivals and scheduling assumptions',analysis:'Test or bound to analyze',goal:'Guarantee to prove'})[key]}">${esc(state.inputDraft[key])}</textarea></label>`).join('')}

  /** Escape text before constructing locally owned markup.
   * @param {string} text Plain input text.

  function esc(text){return String(text).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}
  /** Return an icon placeholder using the host-provided icon set.

  function icon(name){return `<i data-lucide="${name}" aria-hidden="true"></i>`;}
  /** Map an artifact type to a consistent visual symbol.

  /** Render concise rows with a header, without a long prose transcript.
   * @param {Array<string>} headings Column titles.

  function table(headings,rows){return `<table><thead><tr>${headings.map(value=>`<th scope="col">${esc(value)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(value=>`<td>${mathText(value)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
  /** Build a diagram that can be measured after rendering.

   * @returns {string} Responsive mini-graph markup.
   */
  function graph(nodes,edges,description){return `<div class="graph mini-graph" data-edges="${esc(JSON.stringify(edges))}" aria-label="${esc(description)}"><svg class="wires" aria-hidden="true"></svg>${nodes.map(node=>`<button type="button" class="node" data-claim="${node.id}" data-graph-node="${node.id}" aria-pressed="${state.claim===node.id}" style="grid-column:${node.col};grid-row:${node.row};${node.span?'align-self:center;min-height:64px;':''}"><strong>${esc(node.title)}</strong><small>${mathText(node.sub)}</small></button>`).join('')}</div>`;}
  /** Describe the selected claim in one short line.
   * @returns {string} Selected-claim explanation.
   */
  function claimLine(){
    /** @type {Object<string,Array<string>>} Readable roles for illustrative mathematical nodes. */
    const roles={arrival:['Arrival constraint','The minimum separation limits releases.'],execution:['Execution bound','Each job demands at most its task budget.'],workload:['Workload bound','Candidate upper bound on higher-priority demand.'],service:['Available service','Still needs a bridge to actual job service.'],base:['Base definitions','Their semantics must match the project model.'],bridge:['Scheduling bridge','Availability does not automatically equal delivered service.'],completion:['Completion lemma','Connect delivered service to deadline completion.'],target:['Main theorem','Not yet checked by Rocq.'],library:['Prosa resource','Candidate reuse requires exact symbols and discharged premises.']};
    /** @type {Array<string>} Current claim description or its safe generic fallback. */
    const selected=roles[state.claim]||['Selected dependency','Inspect its premises and downstream consumers.'];
    return `<div class="claimline"><strong>${esc(selected[0])}</strong><span>${esc(selected[1])}</span></div>`;
  }

  /** Draw all graph connectors using measured node bounds.
   * @returns {void}
   */
  function drawGraphs(){
    root.querySelectorAll('.graph').forEach(container=>{
      /** @type {SVGElement} Connector layer for the current graph. */
      const svg=container.querySelector('.wires');
      /** @type {DOMRect} Diagram bounds in the current responsive layout. */
      const bounds=container.getBoundingClientRect();
      if(!bounds.width||!bounds.height)return;
      /** @type {Array<Array<string>>} Edges belonging to the stage canvas or a selected artifact. */
      const edges=container.id==='rt-flow'?flowEdges:JSON.parse(container.dataset.edges||'[]');
      svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
      svg.innerHTML=edges.map(([from,to])=>{
        /** @type {HTMLElement|null} Start node. */
        const start=container.querySelector(`[data-graph-node="${from}"]`);
        /** @type {HTMLElement|null} End node. */
        const end=container.querySelector(`[data-graph-node="${to}"]`);
        if(!start||!end)return '';
        /** @type {DOMRect} Source node geometry. */
        const a=start.getBoundingClientRect();
        /** @type {DOMRect} Destination node geometry. */
        const b=end.getBoundingClientRect();
        /** @type {boolean} True when a vertical connector best matches the node arrangement. */
        const vertical=Math.abs(a.left-b.left)<5;
        /** @type {number} Source connector x coordinate. */
        const x1=(vertical?a.left+a.width/2:a.right)-bounds.left;
        /** @type {number} Source connector y coordinate. */
        const y1=(vertical?a.bottom:a.top+a.height/2)-bounds.top;
        /** @type {number} Destination connector x coordinate. */
        const x2=(vertical?b.left+b.width/2:b.left)-bounds.left;
        /** @type {number} Destination connector y coordinate. */
        const y2=(vertical?b.top:b.top+b.height/2)-bounds.top;
        /** @type {string} Orthogonal artifact-dependency path. */
        const line=vertical?`M${x1} ${y1}V${y2-4}`:`M${x1} ${y1}H${(x1+x2)/2}V${y2}H${x2-4}`;
        /** @type {string} Small open arrow, authored as graph geometry. */
        const arrow=vertical?`M${x2-3} ${y2-7}L${x2} ${y2-3}L${x2+3} ${y2-7}`:`M${x2-7} ${y2-3}L${x2-3} ${y2}L${x2-7} ${y2+3}`;
        /** @type {string} Highlight only dependencies adjacent to the current selection. */
        const active=(container.id==='rt-flow'?[from,to].includes(state.stage):[from,to].includes(state.claim))?'relevant':'';
        return `<path class="${active}" d="${line}"/><path class="${active}" d="${arrow}"/>`;
      }).join('');
    });
  }
  /** Refresh the output list, artifact preview and selected state.
   * @returns {void}
   */
  function render(){
    /** @type {Object} Selected stage metadata. */
    const stage=stages[state.stage];
    /** @type {Array<string>} Selected artifact descriptor. */
    const artifact=stage.outputs[state.artifact]||stage.outputs[0];
    renderModule();
    root.classList.toggle('focused',state.page==='derivation'&&state.activeId===3&&state.focus&&state.view==='workflow');
    root.classList.toggle('no-navigation',state.navHidden);
    root.querySelector('#rt-workflow-view').hidden=state.view!=='workflow';
    root.querySelector('#rt-catalog-view').hidden=state.view!=='artifacts';
    root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===state.view)));
    root.querySelectorAll('[data-stage]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.stage===state.stage)));
    root.querySelectorAll('[data-detail]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.detail===state.detail)));
    root.querySelector('#rt-stage-title').textContent=stage.title;
    root.querySelector('#rt-output-count').textContent=stage.outputs.length+' outputs';
    root.querySelector('#rt-artifact-title').textContent=artifact[1];
    /** @type {Object<string,string>} Next action at the currently inspected step. */
    const nextActions={context:stageLink('forward','Inspect forward claims'),forward:stageLink('alignment','Compare claims'),backward:stageLink('alignment','Compare claims'),alignment:stageLink('bridges','Inspect bridge'),bridges:actionButton('revise','Propose a revision',true),proof:pageLink('verification','View verification'),check:pageLink('runs','View run')};
    root.querySelector('#av-next-output').innerHTML=nextActions[state.stage];
    root.querySelector('#rt-artifact-status').textContent=stage.status;
    root.querySelector('#rt-artifact-status').classList.toggle('open',['alignment','bridges'].includes(state.stage));
    root.querySelector('#rt-artifact-id').textContent=artifact[0]+' · v2 · Context v2';
    root.querySelector('#rt-route').value=state.route;
    root.querySelector('#rt-version').textContent=(state.route==='prosa'?'Prosa reuse':'Independent')+' v2';
    root.querySelector('#rt-stage-select').value=state.stage;
    root.querySelector('#rt-focus-label').textContent=state.focus?'Back to workflow':'Focus';
    root.querySelector('[data-action="focus"]').setAttribute('aria-expanded',String(state.focus));
    root.querySelector('[data-action="sidebar"]').setAttribute('aria-expanded',String(!state.navHidden));
    root.querySelector('[data-action="sidebar"]').setAttribute('aria-label',state.navHidden?'Expand navigation':'Collapse navigation');
    root.querySelector('.rail-chevron').textContent=state.navHidden?'›':'‹';
    root.querySelector('#rt-output-list').innerHTML=stage.outputs.map((item,index)=>`<button type="button" class="artifact-button" data-output="${index}" aria-pressed="${index===state.artifact}">${icon(typeIcon(item[2]))}<span>${esc(item[1])}</span></button>`).join('');
    root.querySelector('#rt-artifact-content').innerHTML=state.detail==='preview'?preview(artifact[3]):state.detail==='details'?details(artifact):sources();
    renderCatalog();
    renderMath();
    if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});
    requestAnimationFrame(drawGraphs);
  }
  /** Render the catalog using a literal text filter; links open an exact artifact.
   * @returns {void}
   */
  function renderCatalog(){
    /** @type {Array<Object>} Flat artifact collection for simple searching. */
    const items=Object.entries(stages).flatMap(([stage,record])=>record.outputs.map((output,index)=>({stage,index,output})));
    /** @type {Array<Object>} Matching artifact rows. */
    const matches=items.filter(item=>(item.output[1]+' '+stages[item.stage].name).toLowerCase().includes(state.query.toLowerCase()));
    root.querySelector('#rt-catalog-rows').innerHTML=matches.map(item=>`<button type="button" class="catalog-row" data-catalog-stage="${item.stage}" data-catalog-output="${item.index}"><span class="filelabel">${icon(typeIcon(item.output[2]))}${esc(item.output[1])}</span><span>${stages[item.stage].name}</span><span class="kind">${item.output[2]}</span></button>`).join('');
    root.querySelector('#rt-no-results').hidden=matches.length>0;
  }
  /** Preserve the current presentation state locally.
   * @param {boolean} announce Whether this write commits a newly frozen run.
   * @returns {void}
   */
  function remember(announce=false){
    try{
      localStorage.setItem(storageKey,JSON.stringify({...state,designVersion:4}));
      if(announce)root.querySelector('#av-feedback').textContent=runName(state.activeId)+' saved.';
    }catch{
      /** @type {HTMLElement|null} Current module's local storage status. */
      const message=root.querySelector('#av-feedback');
      if(message)message.textContent='This change is available in this tab only.';
    }
  }
  /** Restore only validated local state belonging to this revision.
   * @param {Object|undefined} saved Prior presentation state.
   * @returns {void}
   */
  function restore(saved){
    if(!saved||![2,3,4].includes(saved.designVersion))return;
    if(pages[saved.page])state.page=saved.page;
    if(stages[saved.stage])state.stage=saved.stage;
    if(Number.isInteger(saved.artifact)&&saved.artifact>=0&&saved.artifact<stages[state.stage].outputs.length)state.artifact=saved.artifact;
    /** @type {Object<string,Array<string>>} Persisted presentation fields and their allowed values. */
    const choices={detail:['preview','details','sources'],view:['workflow','artifacts'],route:['independent','prosa'],documentTab:['pdf','manual'],modelTab:['model','analysis','goal'],verificationTab:['status','obligations','audit','log'],resourceTab:['libraries','models'],runTab:['summary','versions','usage','compare'],settingsTab:['general','models','proof'],appearance:['system','light','dark']};
    Object.entries(choices).forEach(([field,values])=>{if(values.includes(saved[field]))state[field]=saved[field];});
    state.focus=saved.focus===true;state.navHidden=saved.navHidden===true;
    /** @type {Set<number>} Only earlier records can be referenced as parents. */
    const ids=new Set([exampleRun.id]);
    state.records=[];
    for(const entry of Array.isArray(saved.records)?saved.records:[]){
      if(entry?.id!==state.records.length+4||!ids.has(entry.parent))break;
      /** @type {Object} Rebuild a typed delta from known fields. */
      const record={id:entry.id,parent:entry.parent};
      for(const key of [...Object.keys(inputFields),...Object.keys(referenceFields),'source','note']){
        if(typeof entry[key]==='string')record[key]=entry[key].slice(0,key==='note'?350:1800);
      }
      if(['independent','prosa'].includes(entry.route))record.route=entry.route;
      state.records.push(record);ids.add(record.id);
    }
    state.activeId=ids.has(saved.activeId)?saved.activeId:exampleRun.id;
    state.draftParent=ids.has(saved.draftParent)?saved.draftParent:state.activeId;
    state.draftRoute=['independent','prosa'].includes(saved.draftRoute)?saved.draftRoute:recordFor(state.draftParent).route;
    state.draftSource=typeof saved.draftSource==='string'?saved.draftSource.slice(0,300):'Manual input';
    state.draftNote=typeof saved.draftNote==='string'?saved.draftNote.slice(0,350):'';
    state.draftRefs=Object.fromEntries(Object.keys(referenceFields).filter(key=>typeof saved.draftRefs?.[key]==='string').map(key=>[key,saved.draftRefs[key].slice(0,120)]));
    state.draftStarted=saved.draftStarted===true||(saved.designVersion<4&&Object.values(saved.inputDraft||{}).some(Boolean));
    state.reviewing=state.draftStarted&&saved.reviewing===true;
    if(typeof saved.query==='string')state.query=saved.query.slice(0,100);
    if(typeof saved.claim==='string'&&/^[a-z]+$/.test(saved.claim))state.claim=saved.claim;
    if(typeof saved.latex==='string')state.latex=saved.latex.slice(0,1000);
    ['model','analysis','goal'].forEach(field=>{if(typeof saved.inputDraft?.[field]==='string')state.inputDraft[field]=saved.inputDraft[field].slice(0,1800);});
  }
  /** Select a stage while resetting only its artifact-specific view.
   * @param {string} stage Stage identifier.
   * @param {number} artifact Output index, defaulting to its principal visual.
   * @returns {void}
   */
  function selectStage(stage,artifact=0){state.stage=stage;state.artifact=artifact;state.detail='preview';state.claim=stage==='proof'?'target':stage==='bridges'?'bridge':'workload';}
  root.querySelector('#rt-flow').insertAdjacentHTML('beforeend',Object.entries(stages).map(([id,stage])=>`<button type="button" class="node" data-stage="${id}" data-graph-node="${id}" aria-pressed="${id===state.stage}" style="grid-column:${stage.cell[0]};grid-row:${stage.cell[1]}"><strong>${stage.name}</strong><span class="stage-status ${['alignment','bridges'].includes(id)?'open':''}">${stage.status==='Draft'?'':stage.status}</span></button>`).join(''));
  root.querySelector('#rt-stage-select').innerHTML=Object.entries(stages).map(([id,stage])=>`<option value="${id}">${stage.name}</option>`).join('');
  /** Bind a new input draft to the selected record before the first edit. @returns {void} */
  function startInput(){
    if(state.draftStarted)return;
    state.draftParent=state.activeId;state.draftRoute=recordFor(state.activeId).route;state.draftStarted=true;
  }
  /** Clear the editor state once its contents have been frozen or discarded. @returns {void} */
  function clearDraft(){
    state.inputDraft={model:'',analysis:'',goal:''};state.draftRefs={};state.draftNote='';state.draftSource='Manual input';state.draftStarted=false;state.reviewing=false;
  }
  /** Select a frozen run across the project modules. @param {number} id Run identifier. @returns {void} */
  function selectRun(id){state.activeId=id;state.reviewing=false;state.focus=false;state.route=recordFor(id).route;}
  /** Open the editable form without mutating the existing frozen record. @returns {void} */
  function editFields(){state.reviewing=false;state.documentTab='manual';navigate('documents');}
  /** Commit only the changed fields and open the comparison with their parent. @returns {void} */
  function freezeDraft(){
    /** @type {Object} Immutable input record that supplied the baseline. */
    const parent=recordFor(state.draftParent);
    /** @type {Object} Unique child identifier and its explicit parent. */
    const record={id:(state.records.at(-1)?.id||3)+1,parent:parent.id};
    for(const [key,value] of Object.entries(workingCopy()))if(value!==(parent[key]||''))record[key]=value;
    state.records.push(record);clearDraft();selectRun(record.id);state.runTab='compare';navigate('runs');
  }
  /** Refresh only the diff so the route picker and note retain keyboard focus. @returns {void} */
  function updateDraftDiff(){
    /** @type {Array<Array<string>>} Exact parent and draft values for changed fields. */
    const differences=changesBetween(recordFor(state.draftParent),workingCopy());
    root.querySelector('#av-draft-diff').innerHTML=differences.length?table(['Field','Before','After'],differences):'Same inputs and route';
    renderMath();
  }
  /** Validate three editable fields and open a review. @returns {boolean} Whether review opened. */
  function reviewInputs(){
    for(const field of root.querySelectorAll('#av-input-form [data-input-field]')){
      if(!field.value.trim()){
        feedback='Enter the '+field.name+' before review.';
        field.setAttribute('aria-invalid','true');field.focus();root.querySelector('#av-feedback').textContent=feedback;return false;
      }
      state.inputDraft[field.name]=field.value.trim();
    }
    startInput();state.reviewing=true;navigate('modeling');return true;
  }
  root.addEventListener('click',event=>{
    /** @type {HTMLButtonElement|null} Action selected with a pointer or keyboard. */
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.page){
      if(button.dataset.record){selectRun(Number(button.dataset.record));state.runTab=button.dataset.page==='compare'?'compare':'summary';state.modelTab='model';}
      if(button.dataset.page==='modeling')state.reviewing=false;
      navigate(button.dataset.page==='compare'?'runs':button.dataset.page);
    }
    if(button.dataset.tabField){state[button.dataset.tabField]=button.dataset.tabValue;feedback='';}
    if(button.dataset.openStage){if(state.page!=='derivation')state.route=recordFor(state.activeId).route;navigate('derivation');selectStage(button.dataset.openStage,Number(button.dataset.openOutput||0));state.view='workflow';state.focus=false;}
    switch(button.dataset.moduleAction){
      case 'review':if(!reviewInputs())return;break;
      case 'prosa':selectRun(3);state.route='prosa';navigate('derivation');selectStage('proof');state.view='workflow';break;
      case 'revise':prepareDraft();editFields();break;
      case 'enter-fields':editFields();break;
      case 'example-input':
        startInput();state.inputDraft=Object.fromEntries(Object.keys(inputFields).map(key=>[key,exampleRun[key]]));state.draftSource=exampleRun.source;state.draftRefs={};break;
      case 'discard':clearDraft();editFields();break;
      case 'freeze':freezeDraft();break;
    }
    if(button.dataset.stage)selectStage(button.dataset.stage);
    if(button.dataset.output!==undefined){state.artifact=Number(button.dataset.output);state.detail='preview';}
    if(button.dataset.detail)state.detail=button.dataset.detail;
    if(button.dataset.view){state.view=button.dataset.view;state.focus=false;}
    if(button.dataset.claim)state.claim=button.dataset.claim;
    if(button.dataset.catalogStage){selectStage(button.dataset.catalogStage,Number(button.dataset.catalogOutput));state.view='workflow';state.focus=true;}
    if(button.dataset.action==='gap'){selectStage('alignment');state.view='workflow';state.focus=false;}
    if(button.dataset.action==='focus')state.focus=!state.focus;
    if(button.dataset.action==='sidebar')state.navHidden=!state.navHidden;
    if(button.dataset.action==='clear-search'){state.query='';root.querySelector('#rt-search').value='';}
    /** @type {boolean} Narrow screens open artifact detail directly instead of stacking it below the canvas. */
    const openMobileDetail=Boolean(button.dataset.stage||button.dataset.catalogStage||button.dataset.openStage||button.dataset.action==='gap')&&window.matchMedia('(max-width:600px)').matches;
    if(openMobileDetail)state.focus=true;
    render();remember(button.dataset.moduleAction==='freeze');
    if(button.dataset.moduleAction==='review')root.querySelector('#av-draft-route').focus({preventScroll:true});
    if(['enter-fields','revise','example-input','discard'].includes(button.dataset.moduleAction))root.querySelector('[name="model"]').focus({preventScroll:true});
    if(button.dataset.moduleAction==='freeze')root.querySelector('#av-run-select').focus({preventScroll:true});
    // Recreated artifact controls retain keyboard focus after their content changes.
    if(button.dataset.output!==undefined)root.querySelector(`[data-output="${state.artifact}"]`)?.focus({preventScroll:true});
    if(button.dataset.claim)root.querySelector(`[data-claim="${state.claim}"]`)?.focus({preventScroll:true});
    if(button.dataset.catalogStage)root.querySelector('[data-action="focus"]').focus({preventScroll:true});
    if(button.dataset.action==='clear-search')root.querySelector('#rt-search').focus({preventScroll:true});
    if(openMobileDetail)root.querySelector(`[data-output="${state.artifact}"]`)?.focus({preventScroll:true});
    // Recreated navigation and page tabs retain a predictable keyboard focus target.
    if(button.dataset.page){
      root.querySelector(`.rail [data-page="${state.page}"]`)?.focus({preventScroll:true});
      if(window.matchMedia('(max-width:780px)').matches)root.querySelector('.mobile-nav summary').focus({preventScroll:true});
    }
    if(button.dataset.tabField)root.querySelector(`[data-tab-field="${button.dataset.tabField}"][data-tab-value="${button.dataset.tabValue}"]`)?.focus({preventScroll:true});
  });
  root.addEventListener('input',event=>{
    /** @type {HTMLInputElement|HTMLTextAreaElement} Editable local preview field. */
    const field=event.target;
    if(field.dataset.inputField){
      startInput();state.inputDraft[field.dataset.inputField]=field.value;field.removeAttribute('aria-invalid');field.removeAttribute('aria-describedby');
      feedback='';root.querySelector('#av-feedback').textContent='';
      root.querySelector('[data-module-action="example-input"]')?.remove();root.querySelector('[data-module-action="discard"]').hidden=false;remember();
    }
    if(field.dataset.reference){state.draftRefs[field.dataset.reference]=field.value.trim();remember();}
    if(field.id==='av-revision-note'){state.draftNote=field.value;updateDraftDiff();remember();}
    if(field.id==='av-latex'){
      state.latex=field.value;
      root.querySelector('#av-latex-preview').innerHTML=math(state.latex,true);
      renderMath();remember();
    }
  });
  root.addEventListener('change',event=>{
    /** @type {HTMLInputElement|HTMLSelectElement} File or preference control. */
    const field=event.target;
    if(field.id==='av-pdf'){
      /** @type {File|undefined} The reference name is saved with its manually entered fields. */
      const file=field.files?.[0];if(!file)return;
      /** @type {string} Replacing a paper invalidates locators tied to the previous reference. */
      const source='PDF · '+file.name.slice(0,250);startInput();
      if(source!==state.draftSource)state.draftRefs=Object.fromEntries(Object.keys(referenceFields).map(key=>[key,'']));
      state.draftSource=source;root.querySelector('#av-pdf-name').textContent=file.name;remember();
    }
    if(field.id==='av-draft-route'){state.draftRoute=field.value;updateDraftDiff();remember();}
    if(field.id==='av-run-select'){selectRun(Number(field.value));render();remember();root.querySelector('#av-run-select').focus({preventScroll:true});}
    if(field.id==='av-appearance'){state.appearance=field.value;render();remember();root.querySelector('#av-appearance').focus();}
  });
  root.querySelector('#rt-route').addEventListener('change',event=>{state.route=event.target.value;if(state.stage==='proof')state.claim='target';render();remember();});
  root.querySelector('#rt-stage-select').addEventListener('change',event=>{selectStage(event.target.value);render();remember();});
  root.querySelector('#rt-search').addEventListener('input',event=>{state.query=event.target.value;renderCatalog();if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});remember();});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.page==='derivation'&&state.focus){state.focus=false;render();remember();root.querySelector('[data-action="focus"]').focus();}});
  /** @type {string} Origin-local storage for the standalone AutoVISA workspace. */
  const storageKey='autovisa.workspace.v4';
  try{restore(JSON.parse(localStorage.getItem(storageKey)));}catch{/* A fresh tab can run without storage. */}
  root.querySelector('#rt-search').value=state.query;
  render();
  window.addEventListener('DOMContentLoaded',()=>{
    if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});
    renderMath();requestAnimationFrame(drawGraphs);
  });
  document.getElementById('av-katex').addEventListener('load',()=>{renderMath();requestAnimationFrame(drawGraphs);});
  if(window.ResizeObserver){diagramObserver=new ResizeObserver(drawGraphs);diagramObserver.observe(root);}else window.addEventListener('resize',drawGraphs);
})();
</script>
